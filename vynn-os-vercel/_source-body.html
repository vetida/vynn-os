function docCustomer(l,rl,rv){return `<div style="display:flex;justify-content:space-between;margin:14px 0;font-size:12.5px"><div><div style="color:#888;font-size:11px">ลูกค้า</div><div style="font-weight:600">${l.name}</div><div style="color:#555">${l.site}</div><div style="color:#555">โทร ${l.phone}</div></div><div style="text-align:right"><div style="color:#888;font-size:11px">${rl||''}</div><div>${rv||''}</div></div></div>`;}
function docLines(cc){return `<table><thead><tr><th style="width:32px">#</th><th>รายการ</th><th class="doc-num" style="width:52px">จำนวน</th><th class="doc-num" style="width:86px">หน่วยละ</th><th class="doc-num" style="width:94px">จำนวนเงิน</th></tr></thead><tbody>${cc.lines.map((ln,i)=>`<tr><td>${i+1}</td><td>${ln.room} · ${ln.desc}</td><td class="doc-num">${ln.qty}</td><td class="doc-num">${money(ln.sell/ln.qty)}</td><td class="doc-num">${money(ln.sell)}</td></tr>`).join('')}</tbody></table>`;}
function docTotals(cc){return `<table style="width:280px;margin:0 0 0 auto"><tbody><tr><th>รวมเป็นเงิน</th><td class="doc-num">${money(cc.sub)}</td></tr>${cc.discount?`<tr><th>ส่วนลด</th><td class="doc-num">-${money(cc.discount)}</td></tr>`:''}<tr><th>ราคาหลังหักส่วนลด</th><td class="doc-num">${money(cc.netBeforeVat)}</td></tr><tr><th>ภาษีมูลค่าเพิ่ม ${P().vat}%</th><td class="doc-num">${money(cc.vat)}</td></tr><tr><th style="background:#2c2c2c;color:#fff">รวมทั้งสิ้น</th><td class="doc-num" style="font-weight:800">${money(cc.total)}</td></tr></tbody></table>`;}
function docSign(a,b){return `<div style="display:flex;justify-content:space-between;margin-top:46px;font-size:12px;text-align:center"><div style="width:45%">.............................................<div style="margin-top:4px">${a}</div><div style="color:#888;margin-top:2px">วันที่ ......../......../........</div></div><div style="width:45%">.............................................<div style="margin-top:4px">${b}</div><div style="color:#888;margin-top:2px">วันที่ ......../......../........</div></div></div>`;}
function docQuotation(q,l,co,cc){return docHead(co,'ใบเสนอราคา','QUOTATION',q.id,fmtDate(q.date))+docCustomer(l,'พนักงานขาย',personById(l.assignedTo).name)+docLines(cc)+`<div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start"><div style="flex:1;font-size:11px;color:#555;padding-top:6px">* ยืนยันราคาภายใน 30 วัน<br>* มัดจำ 50% เมื่อยืนยันสั่งผลิต · 30% ก่อนติดตั้ง · 20% เมื่อจบงาน<br>* จำนวนเงินเป็นตัวอักษร: <b>(${bahtText(cc.total)})</b></div>${docTotals(cc)}</div>`+docSign('ผู้เสนอราคา / '+co.brand,'ผู้อนุมัติสั่งซื้อ / ลูกค้า');}
function docInvoice(q,l,co,cc){const pi=payInfo(q.id);return docHead(co,'ใบกำกับภาษี / ใบเสร็จรับเงิน','TAX INVOICE / RECEIPT','INV-'+q.id.replace('QT-',''),fmtDate(q.date))+docCustomer(l,'ประเภทงาน',l.brand+' · '+(l.source==='interior'?'ผ่านอินทีเรีย':'ขายตรง'))+docLines(cc)+`<div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start"><div style="flex:1;font-size:11.5px;border:1px solid #cfcfcf;padding:9px 11px;border-radius:4px"><div style="color:#888;font-size:11px">จำนวนเงินเป็นตัวอักษร</div><div style="font-weight:700">(${bahtText(cc.total)})</div><div style="color:#888;font-size:11px;margin-top:8px">การชำระเงิน 3 งวด</div>${pi.sched.map(s=>`<div style="display:flex;justify-content:space-between"><span>งวด ${s.n} (${s.pct}%)</span><span>${money(pi.total*s.pct/100)} · ${s.st==='paid'?'จ่ายแล้ว '+fmtDate(s.d):'ค้างชำระ'}</span></div>`).join('')}</div>${docTotals(cc)}</div>`+docSign('ผู้รับเงิน / '+co.brand,'ผู้รับสินค้า / ลูกค้า')+`<div style="margin-top:12px;font-size:10.5px;color:#999;text-align:center">${co.bank?'ชำระผ่าน '+co.bank+' · ':''}เอกสารตัวอย่างจากระบบ VYNN·OS</div>`;}
function docDelivery(q,l,co,cc){const sv=surveyById(q.surveyId);const ins=state.installs.find(i=>i.quoteId===q.id);return docHead(co,'ใบส่งมอบงาน','DELIVERY / HANDOVER NOTE','DN-'+q.id.replace('QT-',''),ins?fmtDate(ins.scheduled):fmtDate('2026-07-11'))+docCustomer(l,'ทีมติดตั้ง',ins?ins.team:'—')+`<table><thead><tr><th style="width:32px">#</th><th>ห้อง / จุดติดตั้ง</th><th>รายการที่ส่งมอบ</th><th class="doc-num" style="width:66px">จำนวน</th></tr></thead><tbody>${sv?sv.points.map((p,i)=>`<tr><td>${i+1}</td><td>${p.room}</td><td>${p.kind==='curtain'?p.curtainType+' · '+([p.fabricBlackout,p.fabricSheer,p.fabricLining].filter(Boolean).map(cd=>(findFabric(cd)||{}).name||cd).join(' + '))+(p.track==='motor'?' + รางมอเตอร์ '+p.motorModel:' + รางธรรมดา'):p.blindType+(p.track==='motor'?' + มอเตอร์':'')}</td><td class="doc-num">${p.qty}</td></tr>`).join(''):'<tr><td colspan="4">—</td></tr>'}</tbody></table><div style="border:1px solid #cfcfcf;border-radius:4px;padding:9px 12px;font-size:12px;background:#f6faf9"><b>การรับประกัน:</b> รับประกันงานติดตั้ง 1 ปี${ins&&ins.warrantyUntil?' (ถึงวันที่ '+fmtDate(ins.warrantyUntil)+')':''} — ครอบคลุมความเสียหายจากการติดตั้งและอุปกรณ์ตามเงื่อนไข</div><div style="margin-top:10px;font-size:12px;color:#555">ข้าพเจ้าได้รับมอบและตรวจรับงานเรียบร้อยแล้วตามรายการข้างต้น</div>`+docSign('ผู้ส่งมอบงาน / '+co.brand,'ผู้รับมอบงาน / ลูกค้า');}
function docButtons(q,l){const isV=accIsVat(q);const dealt=['approved','accepted'].includes(q.status)||['won','production','installing','done'].includes(l.stage);return `<div><div class="section-title">เอกสาร (พิมพ์ได้)</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-doc="quotation" data-q="${q.id}">${svg('doc','ico')} ใบเสนอราคา</button>${dealt?`<button class="btn sm" data-doc="billing" data-q="${q.id}">${svg('cash','ico')} ใบแจ้งหนี้ (แบ่งงวด)</button>`:''}${['approved','accepted'].includes(q.status)?`<button class="btn sm" data-doc="taxinvoice" data-q="${q.id}">${svg('print','ico')} ${isV?'ใบกำกับภาษี/ใบเสร็จ':'ใบเสร็จรับเงิน'}</button>`:''}${['won','production','installing','done'].includes(l.stage)?`<button class="btn sm" data-doc="delivery" data-q="${q.id}">${svg('doc','ico')} ใบส่งมอบงาน</button>`:''}</div></div>`;}
/* --- standard bilingual (TH/EN) document layout (overrides simple versions above) --- */
function docLetterhead(co,titleTh,titleEn,subRight){const isVg=co.brand==='Vangarde';const bc=isVg?'var(--brand-vangarde)':'var(--brand-vynn)';const bcs=isVg?'var(--brand-vangarde-soft)':'var(--brand-vynn-soft)';return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div style="max-width:60%"><div style="font-size:15px;font-weight:800;color:${bc};letter-spacing:.2px">${co.name}</div><div style="font-size:10px;color:#555;margin-top:3px">${co.addr}</div><div style="font-size:10px;color:#555;margin-top:1px">${co.taxId?'TID: '+co.taxId:''}${co.web?'&nbsp;&nbsp; '+co.web:''}${co.phone?'&nbsp;&nbsp; Tel: '+co.phone:''}</div></div>${co.logo?`<img src="${co.logo}" style="max-height:46px;max-width:160px;object-fit:contain">`:`<div style="font-size:18px;font-weight:800;color:${bc}">${co.brand}</div>`}</div><div style="margin-top:8px;background:${bcs};border-top:2px solid ${bc};border-bottom:2px solid ${bc};text-align:center;padding:4px 0;font-size:13px;font-weight:700;color:${bc}">${titleEn} / ${titleTh} · ${co.brand}</div>`;}
function boxRow(th,en,val){return `<tr><td style="border:none;padding:2px 6px 2px 0;width:46%;vertical-align:top"><span style="font-weight:600;font-size:10.5px">${th}</span> <span style="font-size:8px;color:#999">${en}</span></td><td style="border:none;padding:2px 0;font-size:11px;vertical-align:top;color:#222">${val}</td></tr>`;}
function docParties(l,rightRows){return `<div style="display:flex;gap:10px;margin:10px 0 12px"><div class="doc-box" style="flex:1"><table style="width:100%;border:none;margin:0"><tbody>${boxRow('ลูกค้า','Customer','<b class="brand-name-'+l.brand+'">'+l.name+'</b>')}${boxRow('รหัสลูกค้า','Cust. Code',l.custCode||'-')}${boxRow('ที่อยู่','Address',l.site)}${boxRow('เบอร์โทรศัพท์','Tel No.',l.phone)}${boxRow('วันที่เข้ารับบริการ','Service Date',fmtDate(l.created))}</tbody></table></div><div class="doc-box" style="width:40%"><table style="width:100%;border:none;margin:0"><tbody>${rightRows}</tbody></table></div></div>`;}
function th2(th,en,style){return `<th style="${style||''}"><div style="font-size:10px">${th}</div><div style="font-size:7.5px;color:#888;font-weight:400">${en}</div></th>`;}
function skuOf(pt){if(!pt)return '-';if(pt.kind==='curtain'){const f=(pt.fabrics||[]).find(x=>x.code);return f?f.code:'-';}if(pt.kind==='vangarde')return pt.fabricCode||'-';return pt.blindType||'-';}
function docItems(cc,sv,withImg){const img=pt=>{const p=pt&&(pt.photos||[]).find(x=>x&&x.url);return p?`<img src="${p.url}" style="width:28px;height:28px;object-fit:cover;border-radius:3px">`:`<div style="width:28px;height:28px;border:1px solid #ddd;border-radius:3px;margin:0 auto"></div>`;};return `<table><thead><tr>${th2('รหัส','SKU','width:66px')}${withImg?th2('รูป','Image','width:38px;text-align:center'):''}${th2('รายการสินค้า','Products Item','')}${th2('จำนวน','Qty','width:40px;text-align:right')}${th2('หน่วย','Unit','width:36px')}${th2('ราคา','Unit Price','width:64px;text-align:right')}${th2('ส่วนลด','Discount','width:50px;text-align:right')}${th2('มูลค่าก่อนภาษี','Pre-Tax Amount','width:80px;text-align:right')}</tr></thead><tbody>${cc.lines.map((ln,i)=>{const dl=ln.c.discTotal||0;const listu=dl?(ln.c.listTotal/ln.qty):(ln.product/ln.qty);const dtext=(ln.c.discountLines||[]).map(d=>d[0]+' '+money(d[1])).join(' · ');return `<tr><td style="font-size:9.5px">${skuOf(ln.pt)}</td>${withImg?`<td style="text-align:center">${img(ln.pt)}</td>`:''}<td>${ln.room} · ${ln.desc}${dtext?`<div style="font-size:8px;color:#2e7d46">− ส่วนลด: ${dtext}</div>`:''}</td><td class="doc-num">${ln.qty}</td><td>${ln.c.kind==='curtain'?'ชุด':'จุด'}</td><td class="doc-num">${money(listu)}</td><td class="doc-num">${dl?'−'+money(dl):'0.00'}</td><td class="doc-num">${money(ln.product)}</td></tr>`;}).join('')}</tbody></table>`;}
function docSummary(cc){const productsSum=cc.sub-cc.service;const row=(th,en,val,bold)=>`<div style="display:flex;justify-content:space-between;padding:5px 10px;border-top:1px solid #e2e2e2;${bold?'background:#2c2c2c;color:#fff;font-weight:800':''}"><span>${th} <span style="color:${bold?'#ccc':'#999'};font-size:.8em">/ ${en}</span></span><span class="doc-num">${val}</span></div>`;return `<div style="display:flex;gap:12px;margin-top:10px"><div style="flex:1;border:1px solid #ddd;border-radius:3px;padding:8px 10px;font-size:11px"><div style="color:#888">หมายเหตุ <span style="font-size:.8em">/ Remarks</span></div><div style="min-height:28px"></div><div style="border-top:1px dashed #ccc;padding-top:6px">จำนวนเงินตัวอักษร: <b>(${bahtText(cc.total)})</b></div></div><div style="width:46%;border:1px solid #ddd;border-radius:3px;font-size:11.5px;overflow:hidden">${row('รวมทั้งสิ้น','Sub Total',money(productsSum))}${row('ส่วนลด','Discount',money(cc.discount))}${row('ค่าติดตั้ง/บริการ','Service',money(cc.service))}${cc.vatRate?row('รวมเงินก่อนภาษี','Pre-VAT Amount',money(cc.netBeforeVat))+row('ภาษีมูลค่าเพิ่ม '+cc.vatRate+'%','VAT '+cc.vatRate+'%',money(cc.vat)):''}${row('จำนวนเงินรวมทั้งสิ้น','Grand Total',money(cc.total),true)}</div></div>`;}
// comparison sub-rows for a curtain point's alternative fabric/type options (Phase 2)
function vynnAltRows(pt){if(pt.kind!=='curtain'||!(pt.altOpts&&pt.altOpts.length))return '';const m=v=>v?money(v):'-';return pt.altOpts.map((a,ai)=>{const ac=altCalc(pt,a);const prod=(ac.sellOpaque||0)+(ac.sellSheer||0)+(ac.sellTrack||0);return `<tr style="background:#faf7f0;color:#555"><td></td><td colspan="2" style="font-style:italic;font-size:8.5px">↳ ทางเลือก ${a.label||('#'+(ai+2))}${a.curtainType?' · '+a.curtainType:''}</td><td class="mono" style="font-size:8.5px">${ac.code1||'-'}</td><td class="mono" style="font-size:8.5px">${ac.code2||'-'}</td><td class="doc-num"></td><td class="doc-num"></td><td class="doc-num"></td><td class="doc-num">${m(ac.sellOpaque)}</td><td class="doc-num">${m(ac.sellSheer)}</td><td class="doc-num">${m(ac.sellTrack)}</td><td class="doc-num" style="font-weight:600;font-style:italic">${money(prod)}</td></tr>`;}).join('');}
function docItemsVYNN(cc){const m=v=>v?money(v):'-';const anyAlt=cc.lines.some(ln=>ln.pt&&ln.pt.kind==='curtain'&&ln.pt.altOpts&&ln.pt.altOpts.length);return `<table class="vynn-items" style="font-size:9px;margin-top:8px"><thead><tr style="background:#f3f3f3">${th2('ตำแหน่ง','Area','')}${th2('ประเภท','Product','')}${th2('รายละเอียด','Details','')}${th2('รหัส 1','Code #1','width:52px')}${th2('รหัส 2','Code #2','width:52px')}${th2('กว้าง','W(m)','width:40px;text-align:right')}${th2('สูง','H(m)','width:40px;text-align:right')}${th2('จน.','Qty','width:28px;text-align:right')}${th2('ผ้าทึบ/ม้วน/มู่ลี่/วอลล์','CU,RB,WB,WPP','width:62px;text-align:right')}${th2('ผ้าโปร่ง','Sheer','width:56px;text-align:right')}${th2('ราง/มอเตอร์/อุปกรณ์','Track,Motor,Acc','width:62px;text-align:right')}${th2('จำนวนเงิน','Amount (THB)','width:66px;text-align:right')}</tr></thead><tbody>${cc.lines.map(ln=>{const pt=ln.pt,c=ln.c;const prod=pt.prodLabel||(pt.kind==='curtain'?pt.curtainType:pt.kind==='vangarde'?pt.vgProduct:pt.blindType);const det=pt.detail!=null?pt.detail:(pt.kind==='curtain'?(pt.track==='motor'?'ระบบมอเตอร์ '+pt.motorModel:''):pt.kind==='vangarde'?('เฟรม '+(pt.frameColor||'-')):(pt.note||''));return `<tr><td>${pt.room}</td><td>${prod}</td><td style="font-size:8.5px;color:#555">${det||''}</td><td class="mono" style="font-size:8.5px">${c.code1||'-'}</td><td class="mono" style="font-size:8.5px">${c.code2||'-'}</td><td class="doc-num">${(pt.w/100).toFixed(3)}</td><td class="doc-num">${(pt.h/100).toFixed(3)}</td><td class="doc-num">${pt.qty}</td><td class="doc-num">${m(c.sellOpaque)}</td><td class="doc-num">${m(c.sellSheer)}</td><td class="doc-num">${m(c.sellTrack)}</td><td class="doc-num" style="font-weight:600">${money(ln.product)}</td></tr>`+vynnAltRows(pt);}).join('')}${cc.service?`<tr><td></td><td colspan="7" style="color:#555">ค่าบริการติดตั้ง & ตัดเย็บ <span style="font-size:.85em;color:#999">/ Installation & Tailoring Service</span></td><td class="doc-num">-</td><td class="doc-num">-</td><td class="doc-num">-</td><td class="doc-num" style="font-weight:600">${money(cc.service)}</td></tr>`:''}</tbody></table>${anyAlt?'<div style="font-size:9px;color:#888;margin-top:3px;font-style:italic">↳ แถว "ทางเลือก" = ราคาผ้า/ชนิดม่านทางเลือกของจุดนั้น (ให้ลูกค้าเลือกเทียบราคา ถูก/กลาง/แพง) · ยอดรวมด้านล่างคิดจาก "ตัวเลือกหลัก" ของแต่ละจุด</div>':''}`;}
function docWarrantyNotes(co){const red='color:#c0392b';const li=(t,r)=>`<div style="margin:1px 0;${r?red:''}">${t}</div>`;return `<div style="margin-top:10px;font-size:10px;line-height:1.5"><div style="display:flex;gap:14px;flex-wrap:wrap"><div style="min-width:110px;font-weight:700">การรับประกัน:<div style="font-size:8px;color:#999;font-weight:400">Warranty</div></div><div style="flex:1;min-width:260px">${li('รับประกัน สินค้า ผ้า ราง และอุปกรณ์ เป็นระยะเวลา <b>1 ปี</b> นับจากวันที่ส่งมอบ')}${li('รับประกัน งานติดตั้ง เป็นระยะเวลา <b>3 ปี</b> นับจากวันที่ส่งมอบ',true)}${li('รับประกัน ระบบมอเตอร์ไฟฟ้า Somfy เป็นระยะเวลา <b>5 ปี</b> นับจากวันที่ส่งมอบ *ซ่อม เปลี่ยน เคลมอะไหล่ฟรี (มีค่าบริการ) ** ยกเว้น น้ำเข้า ไฟไหม้ ไฟฟ้าลัดวงจร ไฟกระชาก อุบัติภัยทางธรรมชาติ')}</div></div><div style="display:flex;gap:14px;margin-top:6px"><div style="min-width:110px;font-weight:700">ส่งมอบสินค้า:<div style="font-size:8px;color:#999;font-weight:400">Delivery</div></div><div style="flex:1">${li('ภายใน 30 วัน จากวันที่ยืนยันการสั่งซื้อ / ได้รับการชำระเงิน ยกเว้นสินค้านำเข้า')}</div></div><div style="display:flex;gap:14px;margin-top:6px"><div style="min-width:110px;font-weight:700">หมายเหตุ:<div style="font-size:8px;color:#999;font-weight:400">Remarks</div></div><div style="flex:1">${li('ราคาและส่วนลดสินค้าตามรายการทั้งหมดที่นำเสนอ เป็นราคาพิเศษสำหรับโครงการนี้เท่านั้น ไม่สามารถนำไปใช้กับงานโครงการอื่นได้',true)}${co.vat?li('ราคาที่นำเสนอรวมภาษีมูลค่าเพิ่มแล้ว'):''}${li('ราคาที่นำเสนอรวม บริการออกแบบ ให้คำปรึกษา ตรวจสอบหน้างาน งานผลิต ค่าขนส่งสินค้าถึงหน่วยงาน และค่าติดตั้ง งานเรียบร้อยแล้ว')}${co.vat?'':li('ราคานี้ไม่รวมภาษีมูลค่าเพิ่ม (VAT)')}${li('ราคาที่นำเสนออาจมีการปรับเปลี่ยนได้ ตามขนาดหน้างานจริงและวัสดุที่ใช้ และจะไม่รวมงานด้านระบบไฟ งานแก้ไขประตูหน้าต่าง งานฝ้า งานตรวจสอบโครงสร้าง และการจัดเตรียมพื้นที่หน้างาน นอกจากที่ระบุไว้')}${li('ทางบริษัทฯรับผิดชอบงานตามที่ได้ประเมินจากหน้างานจริงและได้รับการยืนยันจากลูกค้าแล้วเท่านั้น หากงานที่สั่งผลิตเกิดความผิดพลาดเนื่องจากการเปลี่ยนแปลงของหน้างาน ทางบริษัทฯไม่สามารถรับคืน/เปลี่ยนสินค้าได้')}${li('ทางบริษัทขอสงวนสิทธิ์ในการคิดค่าดำเนินการ ขั้นต่ำ 4,000 บาท / ครั้ง หากลูกค้ามีการเปลี่ยนแปลง แก้ไข หรือเลื่อนกำหนดโดยไม่แจ้งล่วงหน้า ทำให้ต้องเข้าหน้างานเพิ่มเติมนอกเหนือจากที่ตกลงกันไว้')}${li('*** ถ้าหากสินค้า / บริการ ไม่ถูกต้องหรือมีตำหนิ โปรดแจ้งให้ทางบริษัททราบภายใน 7 วัน',true)}${li('*** กรณีสินค้าผลิตแล้ว / ติดตั้งเสร็จแล้ว / ตรวจรับมอบงานแล้ว ทางบริษัทขอสงวนสิทธิ์ในการรับสินค้าคืน หรือคืนเงิน ทุกกรณี',true)}</div></div></div>`;}
function docSign3(co){const col=(en,th,withDate)=>`<div style="width:31%;text-align:center"><div style="height:34px"></div><div style="border-top:1px solid #333;padding-top:4px;font-size:11px">${en} <span style="color:#888">/ ${th}</span></div><div style="color:#888;font-size:10px;margin-top:3px">${withDate?'Date / วันที่ : ____ / ____ / ____':'วันที่ : ____ / ____ / ____'}</div></div>`;return `<div style="display:flex;justify-content:space-between;margin-top:26px">${col('Quoted by','ผู้เสนอราคา')}${col('Approved by','ผู้อนุมัติ')}${col('Ordered by','ผู้มีอำนาจสั่งซื้อ',true)}</div>`;}
function docPayTotals(co,cc){const t=cc.total;const disc=cc.sub-cc.netBeforeVat;const payRow=(pct,amt,note)=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>ชำระเงิน ${pct}%: <b>${money(amt)}</b> บาท</span><span style="color:#888;font-size:.9em">${note}</span></div>`;const sRow=(th,en,val,bold)=>`<div style="display:flex;justify-content:space-between;padding:3px 8px;${bold?'background:#2c2c2c;color:#fff;font-weight:800':'border-top:1px solid #e2e2e2'}"><span>${th} <span style="color:${bold?'#ccc':'#999'};font-size:.82em">/ ${en}</span></span><span class="doc-num">${val}</span></div>`;return `<div style="display:flex;gap:12px;margin-top:10px;align-items:flex-start"><div style="flex:1;font-size:10px;line-height:1.55"><div style="font-weight:700">เงื่อนไขการชำระเงิน <span style="font-size:.85em;color:#888">/ Payment Terms</span></div>${payRow(50,t*0.5,'เพื่อยืนยันการสั่งซื้อ/ผลิตสินค้า')}${payRow(30,t*0.3,'ก่อนเข้าติดตั้งงาน 2-3 วัน')}${payRow(20,t*0.2,'หลังจากติดตั้งงานเสร็จเรียบร้อย')}<div style="margin-top:6px;color:#555">การโอนเงิน: กรุณาโอนเงินเข้าบัญชีในนาม<br>"<b>${co.bankName||co.name}</b>" ${co.bank||''}${co.bankAcct?' เลขที่ '+co.bankAcct:''}</div>${co.qr?`<div style="margin-top:6px;display:flex;align-items:center;gap:8px"><img src="${co.qr}" style="max-height:110px;max-width:110px;object-fit:contain;border:1px solid #ddd;padding:3px;background:#fff"><div style="font-size:9px;color:#888">สแกน QR<br>เพื่อโอนเงิน</div></div>`:''}<div style="margin-top:6px">จำนวนเงินตัวอักษร: <b>(${bahtText(t)})</b></div></div><div style="width:44%;border:1px solid #ddd;border-radius:3px;font-size:11px;overflow:hidden">${sRow('ราคารวม','Total',money(cc.sub))}${disc?sRow('ส่วนลดพิเศษ','Special Discount','('+money(disc)+')'):''}${cc.vatRate?sRow('รวมทั้งสิ้น','Sub-total',money(cc.netBeforeVat))+sRow('Vat '+cc.vatRate+'%','VAT',money(cc.vat)):''}${sRow('รวมราคาสุทธิ','Net Total',money(t),true)}</div></div>`;}
// Vangarde quote items — itemized: product model + motor model + accessories + install + discounts (so customer sees where discount comes from)
function docItemsVG(cc){return `<table class="vynn-items" style="font-size:9.5px;margin-top:8px"><thead><tr style="background:#f3f3f3">${th2('รายการสินค้า / อุปกรณ์','Product / Item','')}${th2('ขนาด','Size','width:72px;text-align:center')}${th2('จน.','Qty','width:28px;text-align:right')}${th2('ราคา/หน่วย','Unit Price','width:70px;text-align:right')}${th2('จำนวนเงิน','Amount (THB)','width:82px;text-align:right')}</tr></thead><tbody>${cc.lines.map(ln=>{const c=ln.c,pt=ln.pt;const sz=(pt.w/100).toFixed(2)+'×'+(((pt.d||pt.h||pt.vgExtend||0))/100).toFixed(2)+' ม.';let r=`<tr><td style="font-weight:600">${pt.room?pt.room+' · ':''}${c.baseLabel||c.vgUnit||pt.vgProduct||'-'}${pt.frameColor?' · เฟรม '+pt.frameColor:''}${pt.fabricCode?' · ผ้า '+pt.fabricCode:''}</td><td class="doc-num" style="text-align:center">${sz}</td><td class="doc-num">${pt.qty}</td><td class="doc-num">${money((c.baseAmount||0)/(pt.qty||1))}</td><td class="doc-num" style="font-weight:600">${money(c.baseAmount||0)}</td></tr>`;(c.breakdown||[]).forEach(b=>{if(b[1])r+=`<tr><td style="padding-left:16px;color:#555">+ ${b[0]}</td><td></td><td class="doc-num">${pt.qty}</td><td class="doc-num">${money(b[1]/(pt.qty||1))}</td><td class="doc-num">${money(b[1])}</td></tr>`;});(c.discountLines||[]).forEach(d=>{r+=`<tr><td style="padding-left:16px;color:#2e7d46">− ส่วนลด: ${d[0]}</td><td></td><td></td><td></td><td class="doc-num" style="color:#2e7d46">−${money(d[1])}</td></tr>`;});r+=`<tr style="border-top:1px dashed #ccc"><td colspan="4" style="text-align:right;color:#555">รวมสุทธิรายการนี้ <span style="font-size:.85em;color:#999">/ Line net</span></td><td class="doc-num" style="font-weight:700">${money(ln.product)}</td></tr>`;return r;}).join('')}</tbody></table>`;}
function docQuotation(q,l,co,cc){const nrev=(q.revisions||[]).length;const rr=boxRow('Ref #','เลขที่','QT'+q.id.replace('QT-','')+' - Rev '+nrev)+boxRow('Date','วันที่',fmtDate(q.date))+boxRow('Salesperson','พนักงานขาย',personById(l.assignedTo).name)+boxRow('Prepared by','จัดทำโดย',personById(l.assignedTo).name)+(q.optionLabel&&q.optionLabel!=='หลัก'?boxRow('Option','ตัวเลือก',q.optionLabel):'');return docLetterhead(co,'ใบเสนอราคา','Quotation')+docParties(l,rr)+((cc.lines.length&&cc.lines.every(ln=>ln.pt&&ln.pt.kind==='vangarde'))?docItemsVG(cc):docItemsVYNN(cc))+docPayTotals(co,cc)+docWarrantyNotes(co)+docSign3(co);}
function docInvoice(q,l,co,cc){const sv=surveyById(q.surveyId);const pi=payInfo(q.id);return docLetterhead(co,co.vat?'ใบกำกับภาษี/ใบเสร็จรับเงิน':'ใบเสร็จรับเงิน',co.vat?'Tax Invoice/Receipt':'Receipt','(ต้นฉบับ / Original)')+docParties(l,boxRow('เลขที่ใบเสร็จ','Receipt No.','RE-'+q.id.replace('QT-',''))+boxRow('เลขที่','No.',q.id)+boxRow('วันที่','Issue Date',fmtDate(q.date)))+docItems(cc,sv,true)+docSummary(cc)+`<div style="margin-top:12px;border-top:1px solid #333;padding-top:8px;font-size:11px"><b>การชำระเงิน <span style="font-size:.85em;color:#888">/ Payment</span></b>${co.bank?`<div style="color:#555">โอนผ่านธนาคาร / Bank Transfer · ${co.bank}</div>`:''}${pi.sched.map(s=>`<div style="color:#555">งวด ${s.n} (${s.pct}%) ${money(pi.total*s.pct/100)} บาท — ${s.st==='paid'?'ชำระแล้ว '+fmtDate(s.d)+(s.method?' · '+s.method:'')+(s.ref?' ('+s.ref+')':''):'รอชำระ'}</div>`).join('')}${co.qr?`<div style="margin-top:6px"><img src="${co.qr}" style="max-height:100px;max-width:100px;object-fit:contain;border:1px solid #ddd;padding:3px;background:#fff"><span style="font-size:9px;color:#888;margin-left:6px;vertical-align:bottom">สแกนเพื่อโอนเงิน</span></div>`:''}</div>`+docSign('ผู้รับเงิน / '+co.brand,'ผู้รับสินค้า / ลูกค้า');}
// ใบแจ้งหนี้ / Invoice — แบ่งชำระเป็นงวด (bill next-unpaid installment; shows full schedule)
function docBilling(q,l,co,cc){const sv=surveyById(q.surveyId);const pi=payInfo(q.id);const t=cc.total;
 const due=pi.sched.find(s=>s.st!=='paid')||pi.sched[pi.sched.length-1];const dueAmt=t*due.pct/100;
 const schedRows=pi.sched.map(s=>{const amt=t*s.pct/100;const isDue=s.n===due.n&&s.st!=='paid';return `<div style="display:flex;justify-content:space-between;padding:4px 8px;${isDue?'background:'+((co.brand==='Vangarde')?'var(--brand-vangarde-soft)':'var(--brand-vynn-soft)')+';font-weight:700':'border-top:1px solid #eee'}"><span>งวดที่ ${s.n} (${s.pct}%) <span style="font-size:.85em;color:#888">/ Installment ${s.n}</span>${isDue?' — เรียกเก็บงวดนี้':''}</span><span class="doc-num">${money(amt)} ${s.st==='paid'?'· ชำระแล้ว':''}</span></div>`;}).join('');
 return docLetterhead(co,'ใบแจ้งหนี้','Invoice','(ต้นฉบับ / Original)')
  +docParties(l,boxRow('เลขที่ใบแจ้งหนี้','Invoice No.','IV-'+q.id.replace('QT-','')+'-'+due.n)+boxRow('อ้างอิงใบเสนอราคา','Quotation Ref',q.id)+boxRow('วันที่','Issue Date',fmtDate('2026-07-12'))+boxRow('ครบกำหนดชำระ','Due',due.pct+'% · งวดที่ '+due.n))
  +docItems(cc,sv,false)+docSummary(cc)
  +`<div style="display:flex;gap:12px;margin-top:10px;align-items:flex-start"><div style="flex:1;border:1px solid #ddd;border-radius:3px;overflow:hidden;font-size:11px"><div style="background:#f3f3f3;padding:4px 8px;font-weight:700">แผนการชำระเงินแบ่งงวด <span style="font-size:.85em;color:#888">/ Installments</span></div>${schedRows}</div><div style="width:40%;border:2px solid #333;border-radius:4px;padding:8px 10px;font-size:12px"><div style="color:#888;font-size:11px">ยอดที่ต้องชำระงวดนี้ <span style="font-size:.85em">/ Amount Due Now</span></div><div style="font-size:20px;font-weight:800;margin:4px 0">${money(dueAmt)}</div><div style="font-size:10px;color:#555">(${bahtText(dueAmt)})</div></div></div>`
  +`<div style="margin-top:10px;border-top:1px solid #333;padding-top:8px;font-size:11px"><b>ช่องทางชำระเงิน <span style="font-size:.85em;color:#888">/ Payment</span></b>${co.bank?`<div style="color:#555">โอนเข้าบัญชี "<b>${co.name}</b>" · ${co.bank}</div>`:''}${co.qr?`<div style="margin-top:6px;display:flex;align-items:center;gap:8px"><img src="${co.qr}" style="max-height:110px;max-width:110px;object-fit:contain;border:1px solid #ddd;padding:3px;background:#fff"><div style="font-size:9px;color:#888">สแกน QR<br>เพื่อโอนเงิน</div></div>`:''}</div>`
  +docSign('ผู้วางบิล / '+co.brand,'ผู้รับวางบิล / ลูกค้า');}

function revChart(rev,max,target){

 const yMax=Math.max(max,target)*1.14||1;

 const y=v=>padT+(1-v/yMax)*(H-padT-padB);
 const pts=rev.map((r,i)=>[x(i),y(r.v)]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const area=`M${x(0).toFixed(1)} ${H-padB} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${x(n-1).toFixed(1)} ${H-padB} Z`;
 const ty=y(target),last=pts[n-1];
 return `<div class="table-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;min-width:420px">
  <line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W-padR}" y2="${ty.toFixed(1)}" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>
  <text x="${W-padR}" y="${(ty-7).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--text-faint)">เป้า ${THBk(target)}</text>
  <path d="${area}" fill="var(--accent)" opacity=".08"/>
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===n-1?4:2.4}" fill="${i===n-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.6"/>`).join('')}
  <text x="${last[0].toFixed(1)}" y="${(last[1]-11).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--accent)">${THBk(rev[n-1].v)}</text>
  ${rev.map((r,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text-faint)">${r.m}</text>`).join('')}
 </svg></div>`;}
function convStats(){

}

/* ============ P&L (profit per project + monthly) ============ */
function monthLabel(ym){const[y,m]=ym.split('-');return MM[+m-1]+' '+((+y+543)%100);}
function shipAlloc(quoteId){const lot=state.chinaLots.find(x=>x.pos.some(p=>p.quoteId===quoteId));return lot&&lot.pos.length?Math.round(lot.shipFee/lot.pos.length):0;}
function projectPnL(l){
 const q=quoteOfLead(l.id);if(!q)return null;
 const cc=calcQuote(q);
 const revenue=cc.netBeforeVat;                 // รายได้ก่อน VAT (VAT ไม่นับเป็นรายได้)
 const cogs=cc.cost;                            // ต้นทุนสินค้า/วัตถุดิบ
 const ship=l.brand==='Vangarde'?shipAlloc(q.id):0;
 const referral=l.source==='interior'?Math.round(revenue*(l.referralPct||0)/100):0;
 const sv=surveyById(q.surveyId);
 const points=sv?sv.points.reduce((a,p)=>a+p.qty,0):0;
 const labor=points*(P().installLaborPerPoint||0);
 const travel=travelCostOfLead(l.id);
 const totalCost=cogs+ship+referral+labor+travel;
 const net=revenue-totalCost;
 return {q,l,revenue,cogs,ship,referral,labor,travel,totalCost,net,margin:revenue?net/revenue:0,month:q.date.slice(0,7)};
}

/* ============ FORECAST & บัญชี ============ */
function renderForecast(){

 const pipeStages=['quoted','approved'];

 const pipe=leads.filter(l=>pipeStages.includes(l.stage)).map(dealOf).filter(Boolean);
 const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);

     <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>ค่าเฉลี่ยยอดปิดจริง 3 เดือน</span><b class="tnum">${THB(avg3)}</b></div>

function parseExpense(text){
 text=String(text||'');
 const nums=text.match(/\d[\d,]*(?:\.\d+)?/g);
 let amount=0,amtStr=null;
 if(nums&&nums.length){amtStr=nums[nums.length-1];amount=parseFloat(amtStr.replace(/,/g,''))||0;}
 let note=text;
 if(amtStr){const i=note.lastIndexOf(amtStr);note=note.slice(0,i)+note.slice(i+amtStr.length);}
 note=note.replace(/บาท|฿|thb/gi,'').replace(/\s+/g,' ').trim();
 let category='other';const low=text.toLowerCase();
 for(const cc of EXP_CATS){if(cc.kw.some(k=>low.includes(k.toLowerCase()))){category=cc.id;break;}}
 return {amount,category,note};
}

/* ============ LEAD DRAWER ============ */
function openLead(id){
 const l=leadById(id);if(!l)return;
 const sv=surveyOfLead(id),q=quoteOfLead(id);
 const head=document.getElementById('drawerHead'),body=document.getElementById('drawerBody');
 head.innerHTML=`<div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">${brandChip(l.brand)}<span class="mono" style="font-size:12.5px;font-weight:600">${l.custCode||l.id}</span>${stagePill(l.stage)}</div><h2 style="font-size:17px" class="brand-name-${l.brand}">${l.name}</h2><div class="mini-note" style="margin-top:2px">${l.site} · รับบริการ ${fmtDate(l.created)}</div></div><button class="icon-btn" id="drawerClose">${svg('x')}</button>`;
 const cc=q?calcQuote(q):null;
 const pi=q?payInfo(q.id):null;
 // journey
 const steps=[];
 steps.push({done:true,ico:'inbox',color:'var(--info)',title:'รับลีดเข้าระบบ',meta:`${SOURCE[l.source].l} · ${fmtDate(l.created)}`,
  card:`<div class="kv"><dt>เบอร์</dt><dd>${l.phone}</dd>${l.desiredInstall?`<dt>วันติดตั้งที่ต้องการ</dt><dd>${fmtDate(l.desiredInstall)}</dd>`:''}${l.source==='interior'?`<dt>ผู้แนะนำ</dt><dd>${l.referrer||'—'} · ค่าแนะนำ ${l.referralPct||0}%</dd>`:''}</div>${l.note?`<div class="mini-note" style="margin-top:8px">📝 ${l.note}</div>`:''}`});
 steps.push({done:!!l.assignedTo,ico:'user',color:'var(--accent)',title:l.assignedTo?'มอบหมายให้เซลล์':'รอมอบหมายเซลล์',meta:l.assignedTo?personById(l.assignedTo).name:'ยังไม่มอบหมาย',card:`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="assignSel" style="padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:13px">${SALES.map(s=>`<option value="${s.id}" ${((l.assignedTo||SALES[0].id)===s.id)?'selected':''}>${s.name}</option>`).join('')}</select><button class="btn primary" id="assignBtn">${l.assignedTo?'เปลี่ยนผู้รับผิดชอบ':'＋ มอบหมาย'}</button></div>`});
 const svPhotos=sv?sv.points.reduce((a,p)=>a+(p.photos||[]).length,0):0;
 steps.push({done:!!sv,ico:'ruler',color:'var(--warn)',title:sv?`วัดหน้างานแล้ว · ${sv.points.length} จุด`:'รอวัดหน้างาน',meta:sv?`${fmtDate(sv.date)} · โดย ${personById(sv.by).short} · ${svPhotos} รูป`:'—',

/* ============ SALES HISTORY (12-month cumulative) ============ */
function last12Months(){
 const cy=2026,cm=7; // "current" month in this demo dataset
 const arr=[];
 for(let i=11;i>=0;i--){const idx=(cy*12+(cm-1))-i;const yy=Math.floor(idx/12),mm=(idx%12)+1;arr.push({y:yy,m:mm,key:yy+'-'+String(mm).padStart(2,'0'),label:MM[mm-1]+' '+String((yy+543)%100)});}
 return arr;
}
function seedSalesHist(){
 const months=last12Months();const h={};
 SALES.forEach((s,si)=>{
  let seed=0;for(const ch of s.id)seed+=ch.charCodeAt(0);
  const base=150000+si*38000;
  h[s.id]=months.map((mo,mi)=>{
   const wave=Math.sin((mi+seed)*0.7)*0.32+Math.cos((mi+seed)*1.3)*0.16;
   const growth=1+mi*0.02;
   let v=Math.round((base*(1+wave)*growth)/1000)*1000;
   if(v<20000)v=20000+(seed%5)*5000;
   return{m:mo.key,v};
  });
 });
 return h;
}
function liveMonthRevenue(sid){return state.leads.filter(l=>l.assignedTo===sid&&['won','production','installing','done'].includes(l.stage)).reduce((a,l)=>a+dealTotal(l.id),0);}
function renderSalesHist(){
 const c=document.getElementById('content');
 const months=last12Months();
 if(!state.salesHist)state.salesHist=seedSalesHist();
 const mine=myScopeId();
 let list=mine?SALES.filter(s=>s.id===mine):SALES;
 const totalOf=s=>{const h=(state.salesHist[s.id]||[]).slice();if(h.length)h[h.length-1]={m:months[months.length-1].key,v:liveMonthRevenue(s.id)};return h.reduce((a,x)=>a+x.v,0);};
 const rowsHtml=list.map(s=>{
  const hist=(state.salesHist[s.id]||[]).slice();
  if(hist.length)hist[hist.length-1]={m:months[months.length-1].key,v:liveMonthRevenue(s.id)};
  const total=hist.reduce((a,x)=>a+x.v,0);
  const max=Math.max(...hist.map(x=>x.v),1);
  const bars=hist.map((x,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;height:74px;background:var(--surface-2);border-radius:3px;display:flex;align-items:flex-end"><div title="${months[i].label}: ${THB(x.v)}" style="width:100%;background:${s.color};border-radius:3px;height:${Math.max(x.v/max*100,3)}%"></div></div><div style="font-size:9px;color:var(--text-faint);white-space:nowrap">${months[i].label}</div></div>`).join('');
  const avg=Math.round(total/12);
  return `<div class="card" style="margin-bottom:14px"><div class="card-head">${avatar(s.id)}<h3 style="margin-left:2px">${s.name}</h3><span class="spacer"></span><div style="text-align:right"><div class="mini-note">ยอดสะสม 12 เดือน</div><div style="font-size:19px;font-weight:800;color:var(--good)">${THB(total)}</div><div class="mini-note">เฉลี่ย ${THBk(avg)}/เดือน</div></div></div><div class="card-pad"><div style="display:flex;gap:5px;align-items:flex-end">${bars}</div></div></div>`;
 }).join('');
 const grand=list.reduce((a,s)=>a+totalOf(s),0);
 c.innerHTML=`${mine?'<div class="banner-info">'+svg('user')+'มุมมองเซลล์ — เห็นเฉพาะยอดขายสะสมของตัวเอง</div>':`<div class="stat-row" style="margin-bottom:16px"><div class="stat"><div class="tile-ico">${svg('trend')}</div><div class="label">ยอดขายรวมทุกเซลล์ (12 เดือน)</div><div class="value">${THB(grand)}</div><div class="mini-note" style="margin-top:6px">${list.length} คน · ย้อนหลังถึง ${months[0].label}</div></div></div>`}${rowsHtml||'<div class="card"><div class="empty">ไม่มีข้อมูล</div></div>'}`;
}
