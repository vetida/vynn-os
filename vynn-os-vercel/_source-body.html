<style>
  :root {
    --bg:#F5F3EF; --surface:#FFFFFF; --surface-2:#FBFAF8; --border:#E7E2DA; --border-strong:#D8D1C6;
    --text:#211E1A; --text-muted:#6E675D; --text-faint:#9A9186;
    --accent:#0F6E68; --accent-hover:#0B5751; --accent-soft:#E1EEEC;
    --brand-vynn:#2E6FE0; --brand-vynn-soft:#E7EEFC; --brand-vangarde:#D8434F; --brand-vangarde-soft:#FBE7E8;
    --good:#2E7D46; --good-soft:#E4F0E7; --warn:#B77504; --warn-soft:#F8EDD8;
    --crit:#C0392B; --crit-soft:#F8E3E0; --info:#2C6BB3; --info-soft:#E3ECF6;
    --shadow:0 1px 2px rgba(30,25,18,.04),0 4px 16px rgba(30,25,18,.06); --shadow-lg:0 8px 40px rgba(30,25,18,.16);
    --radius:12px; --radius-sm:8px; --sidebar-w:246px;
    --font:system-ui,-apple-system,"Segoe UI","Leelawadee UI","Noto Sans Thai","Sarabun",sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#14171A; --surface:#1C2023; --surface-2:#21262A; --border:#2E3439; --border-strong:#3A4147;
    --text:#ECE7DF; --text-muted:#A29B8F; --text-faint:#756E64;
    --accent:#3FB0A6; --accent-hover:#57C3B9; --accent-soft:#123A37;
    --brand-vynn:#84B4FF; --brand-vynn-soft:#182740; --brand-vangarde:#FF8A92; --brand-vangarde-soft:#3B1E22;
    --good:#5BB877; --good-soft:#16301F; --warn:#DDA43A; --warn-soft:#332816;
    --crit:#E07568; --crit-soft:#351E1B; --info:#6BA3DE; --info-soft:#16283A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 8px 40px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --bg:#14171A; --surface:#1C2023; --surface-2:#21262A; --border:#2E3439; --border-strong:#3A4147;
    --text:#ECE7DF; --text-muted:#A29B8F; --text-faint:#756E64;
    --accent:#3FB0A6; --accent-hover:#57C3B9; --accent-soft:#123A37;
    --brand-vynn:#84B4FF; --brand-vynn-soft:#182740; --brand-vangarde:#FF8A92; --brand-vangarde-soft:#3B1E22;
    --good:#5BB877; --good-soft:#16301F; --warn:#DDA43A; --warn-soft:#332816;
    --crit:#E07568; --crit-soft:#351E1B; --info:#6BA3DE; --info-soft:#16283A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 8px 40px rgba(0,0,0,.5);
  }
  :root[data-theme="light"]{
    --bg:#F5F3EF; --surface:#FFFFFF; --surface-2:#FBFAF8; --border:#E7E2DA; --border-strong:#D8D1C6;
    --text:#211E1A; --text-muted:#6E675D; --text-faint:#9A9186;
    --accent:#0F6E68; --accent-hover:#0B5751; --accent-soft:#E1EEEC;
    --brand-vynn:#2E6FE0; --brand-vynn-soft:#E7EEFC; --brand-vangarde:#D8434F; --brand-vangarde-soft:#FBE7E8;
    --good:#2E7D46; --good-soft:#E4F0E7; --warn:#B77504; --warn-soft:#F8EDD8;
    --crit:#C0392B; --crit-soft:#F8E3E0; --info:#2C6BB3; --info-soft:#E3ECF6;
    --shadow:0 1px 2px rgba(30,25,18,.04),0 4px 16px rgba(30,25,18,.06); --shadow-lg:0 8px 40px rgba(30,25,18,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:650;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  .tnum{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono)}
  /* default size for inline icons produced by svg() with no explicit class */
  svg[class=""]{width:1.1em;height:1.1em;flex-shrink:0;vertical-align:-0.14em}
  .ico{width:16px;height:16px;flex-shrink:0}
  .card-head>svg[class=""]{width:18px;height:18px;color:var(--text-muted)}
  .banner-info>svg[class=""]{width:17px;height:17px}
  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 20px 12px;display:flex;flex-direction:column;gap:3px}
  .brand .logo{font-size:19px;font-weight:750;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
  .brand .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .brand .sub{font-size:11px;color:var(--text-faint);letter-spacing:.04em;text-transform:uppercase}
  .nav{padding:4px 12px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
  .nav .group-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);padding:13px 10px 4px;font-weight:600}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 10px;border:none;background:transparent;color:var(--text-muted);border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:background .12s,color .12s}
  .nav button:hover{background:var(--surface-2);color:var(--text)}
  .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav button .ico{width:17px;height:17px;flex-shrink:0}
  .nav button .badge{margin-left:auto;font-size:11px;background:var(--border);color:var(--text-muted);padding:1px 7px;border-radius:20px;font-variant-numeric:tabular-nums}
  .nav button.active .badge{background:var(--accent);color:#fff}
  .side-foot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .role-pick{display:flex;flex-direction:column;gap:5px}
  .role-pick .rp-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:600}
  .role-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
  .role-seg button{border:none;background:transparent;padding:7px 4px;font-size:11.5px;color:var(--text-muted);font-weight:550;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .role-seg button:nth-child(2n){border-right:none}
  .role-seg button:nth-child(n+3){border-bottom:none}
  .role-seg button.active{background:var(--accent);color:#fff}
  .cell-input{width:88px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface-2);color:var(--text);font-size:12.5px;font-family:inherit;text-align:right;outline:none}
  .cell-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .theme-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-muted);font-size:12px}
  .theme-toggle:hover{color:var(--text);border-color:var(--border-strong)}
  .reset-btn{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-faint);font-size:11px}
  .reset-btn:hover{color:var(--crit);border-color:var(--crit)}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;gap:16px}
  .topbar .page-title{font-size:19px;font-weight:680}
  .topbar .page-sub{font-size:12px;color:var(--text-muted);margin-top:1px}
  .topbar .spacer{flex:1}
  .brand-filter{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px;gap:2px}
  .brand-filter button{border:none;background:transparent;padding:5px 13px;border-radius:16px;font-size:12.5px;font-weight:550;color:var(--text-muted)}
  .brand-filter button.active{background:var(--text);color:var(--bg)}
  .brand-filter button[data-b="VYNN"].active{background:var(--brand-vynn);color:#fff}
  .brand-filter button[data-b="Vangarde"].active{background:var(--brand-vangarde);color:#fff}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:550;transition:.12s}
  .btn:hover{border-color:var(--text-muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn .ico{width:16px;height:16px}
  .content{padding:22px 26px 60px;max-width:1340px;width:100%}
  .grid{display:grid;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-pad{padding:18px 20px}
  .card-head{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--border)}
  .card-head h3{font-size:14px}
  .card-head .hint{font-size:12px;color:var(--text-faint)}
  .card-head .spacer{flex:1}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .stat .label{font-size:12px;color:var(--text-muted);font-weight:550}
  .stat .value{font-size:25px;font-weight:720;margin-top:7px;letter-spacing:-.02em;line-height:1}
  .stat .value small{font-size:14px;font-weight:600;color:var(--text-muted)}
  .stat .delta{font-size:12px;margin-top:7px;display:inline-flex;align-items:center;gap:4px;font-weight:600}
  .stat .delta.up{color:var(--good)} .stat .delta.down{color:var(--crit)}
  .stat .spark{position:absolute;right:0;bottom:0;width:92px;height:38px;opacity:.9}
  .stat .tile-ico{position:absolute;top:15px;right:15px;width:19px;height:19px;color:var(--text-faint)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .pill .pdot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)}
  .pill.neutral{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}
  .pill.accent{background:var(--accent-soft);color:var(--accent)}
  .chip-brand{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:6px}
  .chip-brand.VYNN{background:var(--brand-vynn-soft);color:var(--brand-vynn)}
  .chip-brand.Vangarde{background:var(--brand-vangarde-soft);color:var(--brand-vangarde)}
  .doc-paper{--brand-vynn:#2E6FE0;--brand-vynn-soft:#E7EEFC;--brand-vangarde:#D8434F;--brand-vangarde-soft:#FBE7E8}
  .brand-name-VYNN{color:var(--brand-vynn)}
  .brand-name-Vangarde{color:var(--brand-vangarde)}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr{transition:background .1s}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover{background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:650;color:#fff;flex-shrink:0}
  .who{display:inline-flex;align-items:center;gap:8px}
  .funnel{display:flex;flex-direction:column;gap:7px}
  .funnel-row{display:grid;grid-template-columns:118px 1fr 64px;align-items:center;gap:12px}
  .funnel-row .fl{font-size:12.5px;color:var(--text-muted);font-weight:550}
  .funnel-bar{height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;padding-left:10px;color:#fff;font-size:12.5px;font-weight:650;min-width:30px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .funnel-row .fr{font-size:12px;color:var(--text-faint);text-align:right;font-variant-numeric:tabular-nums}
  .lb-row{display:grid;grid-template-columns:150px 1fr 96px;align-items:center;gap:12px;padding:7px 0}
  .lb-track{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden}
  .lb-fill{height:100%;border-radius:6px;transition:width .5s}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  .legend .li{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
  .legend .sw{width:10px;height:10px;border-radius:3px}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:650;margin:4px 0 10px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px}
  .search input{border:none;background:transparent;color:var(--text);font-size:13px;width:100%;outline:none;font-family:inherit}
  .search .ico{width:16px;height:16px;color:var(--text-faint)}
  .steps{display:flex;align-items:center;gap:0;flex-wrap:wrap}
  .steps .step{display:flex;align-items:center;gap:7px}
  .steps .node{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--border-strong);background:var(--surface);color:var(--text-faint);flex-shrink:0}
  .steps .node svg{width:12px;height:12px}
  .steps .node.done{background:var(--good);border-color:var(--good);color:#fff}
  .steps .node.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .steps .line{width:22px;height:2px;background:var(--border-strong)}
  .steps .line.done{background:var(--good)}
  .step-label{font-size:10.5px;color:var(--text-muted)}
  .scrim{position:fixed;inset:0;background:rgba(20,16,10,.42);backdrop-filter:blur(2px);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:96vw;background:var(--bg);box-shadow:var(--shadow-lg);z-index:100;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;background:var(--surface)}
  .drawer-body{overflow-y:auto;padding:18px 22px 40px;flex:1;display:flex;flex-direction:column;gap:16px}
  .icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted)}
  .icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
  .journey{display:flex;flex-direction:column}
  .jrow{display:grid;grid-template-columns:30px 1fr;gap:12px}
  .jrow .jline{display:flex;flex-direction:column;align-items:center}
  .jrow .jnode{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
  .jrow .jnode svg{width:15px;height:15px}
  .jrow .jconn{width:2px;flex:1;background:var(--border);min-height:12px}
  .jrow.done .jconn{background:var(--good)}
  .jrow .jcontent{padding-bottom:16px}
  .jrow .jtitle{font-size:13.5px;font-weight:620}
  .jrow .jmeta{font-size:12px;color:var(--text-muted);margin-top:2px}
  .jrow .jcard{margin-top:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13px}
  .kv dt{color:var(--text-muted)} .kv dd{margin:0;font-weight:550}
  .modal-card{position:fixed;z-index:100;top:50%;left:50%;transform:translate(-50%,-50%) scale(.97);opacity:0;pointer-events:none;width:520px;max-width:94vw;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);transition:opacity .18s,transform .18s;max-height:92vh;overflow-y:auto}
  .modal-card.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
  .field label{font-size:12px;font-weight:600;color:var(--text-muted)}
  .field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-size:13.5px;font-family:inherit;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field-row.three{grid-template-columns:1fr 1fr 1fr}
  .empty{text-align:center;padding:44px 20px;color:var(--text-faint)}
  .empty svg{width:32px;height:32px;margin-bottom:10px;opacity:.5}
  .mini-note{font-size:11.5px;color:var(--text-faint)}
  .progress-mini{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;width:100%;display:inline-block;vertical-align:middle}
  .progress-mini>span{display:block;height:100%;background:var(--accent);border-radius:4px}
  a.linkish{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
  a.linkish:hover{text-decoration:underline}
  .pay-track{display:flex;gap:4px;align-items:center}
  .pay-seg{height:8px;border-radius:3px;flex:1}
  .banner-info{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center;margin-bottom:16px}
  .cost-hidden{color:var(--text-faint);font-style:italic;font-size:12px}
  .hamburger{display:none}
  /* printable documents */
  .doc-overlay{position:fixed;inset:0;z-index:200;background:rgba(20,16,10,.55);overflow:auto;padding:22px 12px;display:none}
  .doc-toolbar{max-width:800px;margin:0 auto 12px;display:flex;gap:8px;justify-content:flex-end;position:sticky;top:0}
  .doc-paper{max-width:800px;margin:0 auto;background:#fff;color:#1c1c1c;padding:40px 44px;box-shadow:0 8px 40px rgba(0,0,0,.4);border-radius:2px;font-size:13px;line-height:1.5}
  .doc-paper.doc-wide{max-width:1080px;width:100%;padding:30px 34px}
  .doc-toolbar.doc-wide{max-width:1080px}
  .slip-page{margin-bottom:22px}
  .doc-paper table.vynn-items{table-layout:fixed}
  .doc-paper table.vynn-items th,.doc-paper table.vynn-items td{padding:3px 4px;font-size:8.5px;word-break:break-word}
  .doc-paper h1{font-size:19px;color:#111;letter-spacing:0}
  .doc-paper table{width:100%;border-collapse:collapse;margin:14px 0}
  .doc-paper th,.doc-paper td{border:1px solid #cfcfcf;padding:7px 9px;font-size:12.5px;vertical-align:top}
  .doc-paper th{background:#f2f0ec;text-align:left;color:#333;font-weight:600}
  .doc-num{text-align:right;font-variant-numeric:tabular-nums}
  .doc-box{border:1px solid #bbb;border-radius:3px;padding:8px 10px}
  .sv-overlay{position:fixed;inset:0;z-index:150;background:var(--bg);overflow:auto;display:none}
  .sv-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;z-index:2;flex-wrap:wrap}
  .sv-body{padding:16px 20px 80px;max-width:940px;margin:0 auto;width:100%}
  .pt-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .pt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}
  .pt-grid .field{margin-bottom:0}
  .pt-grid .field.col2{grid-column:span 2}

// auto-suggest the right series from entered size (meters)
function vgSuggestSeries(prod,wM,dM,hM){
 const vg=state.vgPricing||defaultVgPricing();
 if(prod==='Pergola'){
  for(const r of vg.pergola){const m=(r.max||'').split('×').map(Number),mw=m[0]||99,ml=m[1]||99,mh=m[2]||99;
   if(((wM<=mw&&dM<=ml)||(wM<=ml&&dM<=mw))&&(!hM||hM<=mh))return r.series;}
  return vg.pergola[vg.pergola.length-1].series;
 }
 if(prod==='Zip Shade'){
  const fit=vg.zipshade.find(r=>wM<=(r.maxW||99)&&hM<=(r.maxH||99));
  return (fit||vg.zipshade[vg.zipshade.length-1]).series;
 }
 return null;
}

/* ============ STATE ============ */
const LS='vynn_os_v2';
let state, view='overview', brand='all', search='', role='admin', hrMonth='2026-07';
let currentUser=null; // the logged-in account (from ACCOUNTS)

/* ============ AUTH / RBAC ============ */
const SESS='vynn_os_session';
// which view ids each role may open. 'admin' = full access.
const ACCESS={
 admin:'*',
 manager:['overview','leads','survey','quote','vgprice','sewing','china','install','service','finance','expenses','saleshist'],
 sales_support:['overview','leads','survey','quote','vgprice','sewing','china','install','service','finance','expenses','settings'],
 sales:['overview','leads','survey','quote','vgprice','install','service','finance','expenses','saleshist'],
 hr:['overview','expenses','hr'],
 accounting:['overview','expenses','hr'],
 installer:['install'],
};
function canView(v){const a=ACCESS[role];return a==='*'||(a&&a.includes(v));}
function firstAllowedView(){if(canView('overview'))return 'overview';const a=ACCESS[role];return (a==='*')?'overview':(a&&a[0])||'overview';}
// current employee id for sales-scoping (sales sees only own); '' means see all
function myScopeId(){return currentUser&&currentUser.role==='sales'?currentUser.id:'';}
function pwOf(uid){return (state&&state.passwords&&state.passwords[uid])||accountByUid(uid).pw;}
function tryLogin(loginId,pw){
 const u=accountByLogin(loginId);
 if(!u)return{ok:false,msg:'ไม่พบรหัสพนักงานนี้'};
 if(pwOf(u.id)!==pw)return{ok:false,msg:'รหัสผ่านไม่ถูกต้อง'};
 setSession(u.id);
 logAudit('login','เข้าสู่ระบบ');
 return{ok:true};
}
function setSession(uid){currentUser=accountByUid(uid);role=currentUser.role;try{localStorage.setItem(SESS,uid);}catch(e){}}
function logout(){logAudit('logout','ออกจากระบบ');currentUser=null;try{localStorage.removeItem(SESS);}catch(e){}brand='all';showLogin();}
function restoreSession(){let uid=null;try{uid=localStorage.getItem(SESS);}catch(e){}if(uid&&accountByUid(uid)){setSession(uid);return true;}return false;}
// ---- audit log (kept in state, trimmed to last ~600 / 60 days) ----
function logAudit(action,detail){
 if(!state)return;
 if(!state.audit)state.audit=[];
 const u=currentUser||{id:'?',name:'ไม่ทราบ',role:'?'};
 state.audit.push({ts:new Date().toISOString(),uid:u.id,name:u.name,role:u.role,action,detail:detail||''});
 const cut=Date.now()-60*864e5;
 state.audit=state.audit.filter(e=>new Date(e.ts).getTime()>=cut).slice(-600);
 save();
}
const ROLE_LABEL={admin:'แอดมิน',manager:'ผู้จัดการ',sales_support:'ซัพพอร์ต',sales:'เซลล์',hr:'ฝ่ายบุคคล',accounting:'ฝ่ายบัญชี',installer:'ช่างติดตั้ง'};
const ROLE_COLOR={admin:'#7A4FB5',manager:'#B77504',sales_support:'#0E7C86',sales:'#0F6E68',hr:'#2C6BB3',accounting:'#0E7C86',installer:'#C0392B'};
function showLogin(){document.getElementById('loginScreen').style.display='flex';document.querySelector('.app').style.display='none';const e=document.getElementById('loginErr');e.classList.remove('show');document.getElementById('loginForm').reset();setTimeout(()=>document.getElementById('loginId').focus(),50);}
function showApp(){document.getElementById('loginScreen').style.display='none';document.querySelector('.app').style.display='';if(!canView(view))view=firstAllowedView();renderUserChip();render();}
function renderUserChip(){
 const el=document.getElementById('userChip');if(!el||!currentUser)return;
 const col=currentUser.color||ROLE_COLOR[role]||'#7A4FB5';
 el.innerHTML=`<div class="user-chip"><div class="uc-av" style="background:${col}">${(currentUser.short||currentUser.name||'?').slice(0,2)}</div><div style="flex:1;min-width:0"><div class="uc-name">${currentUser.name}</div><div class="uc-role"><span class="role-badge" style="background:${col}22;color:${col}">${ROLE_LABEL[role]||role}</span> · ${currentUser.login}</div></div></div>`;
}
function migrateState(){
 if(!state.accounts)state.accounts=defaultAccounts();
 if(!state.employees)state.employees=defaultEmployees();
 if(!state.attendance||!state.advances){const h=seedHR();if(!state.attendance)state.attendance=h.attendance;if(!state.advances)state.advances=h.advances;}
 if(!state.payroll)state.payroll={};
 if(state.leads)state.leads.forEach(l=>{if(!l.custCode)l.custCode=nextCustCode(l.brand);});
 if(!state.tickets)state.tickets=[];state.tickets.forEach(t=>{t.photos=t.photos||[];t.log=t.log||[];});
 if(!state.company)state.company=defaultCompany();Object.values(state.company).forEach(co=>{if(co.logo===undefined)co.logo='';});
 if(state.prices){['curtainMode','curtainMult','sqmMargin','fabDisc','curtainRail'].forEach(k=>{if(state.prices[k]===undefined)state.prices[k]=structuredClone(DEFAULT_PRICES[k]);});}
 if(state.surveys)state.surveys.forEach(s=>s.points.forEach(migratePoint));
 if(state.quotes)state.quotes.forEach(migrateQuote);
 if(!state.travelClaims)state.travelClaims=[];
 if(!state.expenses)state.expenses=[]; // ค่าใช้จ่ายรายวัน (พนักงานกรอกเอง)
 if(state.seq&&!state.seq.T)state.seq.T=903;
 if(state.seq&&!state.seq.TR)state.seq.TR=1;
 if(state.seq&&!state.seq.EX)state.seq.EX=1;
 if(!state.passwords)state.passwords={}; // per-user password overrides (uid -> pw)

function calcQuote(q){
 const sv=surveyById(q.surveyId); const pts=(q.points&&q.points.length)?q.points:(sv?sv.points:null); if(!pts) return {sub:0,service:0,discount:0,adjust:0,netBeforeVat:0,vat:0,total:0,cost:0,margin:0,lines:[],order:[]};
 const lines=[],order=[]; let sub=0,cost=0,service=0;
 pts.forEach((pt,i)=>{const c=calcPoint(pt,q.priceMode);sub+=c.sell;cost+=c.cost;service+=(c.inst||0);
   const fabNames=pt.kind==='curtain'?((pt.fabrics||[]).filter(f=>f.code).map(f=>f.code).join(' + ')):'';
   const desc=pt.prodLabel?`${pt.prodLabel}${pt.detail?' · '+pt.detail:''}`:pt.kind==='curtain'?`${pt.curtainType} · ${fabNames}${pt.track==='motor'?' + มอเตอร์':''}`:pt.kind==='vangarde'?`${pt.vgProduct} · เฟรม ${pt.frameColor||'-'} / ผ้า ${pt.fabricCode||'-'}${vgHasMotor(pt)?' + มอเตอร์':''}`:`${pt.blindType}${pt.track==='motor'?' + มอเตอร์':''}`;
   lines.push({room:pt.room,desc,qty:pt.qty,sell:c.sell,product:c.sell-(c.inst||0),cost:c.cost,c,pt});
   c.order.forEach(o=>order.push(o));});
 const vynnSub=lines.filter(l=>l.pt.kind==='curtain'||l.pt.kind==='blind').reduce((a,l)=>a+l.sell,0);
 const vynnInst=vynnSub>0?(vynnSub<30000?3000:0):0;   // VYNN ค่าติดตั้ง 3,000/งาน ถ้ายอด < 30,000 ก่อน VAT (ยอด ≥ 30,000 = ฟรี)
 if(vynnInst)service+=vynnInst;
 const discount=q.discount||0;const adjust=q.adjust||0;
 const netBeforeVat=sub+vynnInst-discount+adjust;
 const vatRate=accVatRate(q);
 const vat=netBeforeVat*vatRate/100;
 const total=netBeforeVat+vat;
 return {sub,service,discount,adjust,netBeforeVat,vatRate,vat,total,cost,margin:netBeforeVat-cost,lines,order};
}

 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2" fill="${color}"/></svg>`;}

function renderNav(){
 const nav=document.getElementById('nav');
 // an item is visible if the current role may open it
 const itemVisible=n=>!n.grp&&canView(n.id);
 let html='';
 NAV.forEach((n,i)=>{
  if(n.grp){
   // show the group label only if at least one following item (until next group) is visible
   let any=false;
   for(let j=i+1;j<NAV.length&&!NAV[j].grp;j++){if(itemVisible(NAV[j])){any=true;break;}}
   if(any)html+=`<div class="group-label">${n.grp}</div>`;
   return;
  }
  if(!itemVisible(n))return;
  const c=n.count?n.count():0;
  html+=`<button data-view="${n.id}" class="${view===n.id?'active':''}">${svg(n.icon,'ico')}<span>${n.label}</span>${c?`<span class="badge">${c}</span>`:''}</button>`;
 });
 nav.innerHTML=html;
 nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;search='';document.querySelector('.sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open');render();});
}

function sourceBreak(L){
 const by={};L.forEach(l=>by[l.source]=(by[l.source]||0)+1);const total=L.length||1;
 const colors={line:'#2E7D46',booth:'#2C6BB3',repeat:'#B77504',interior:'#B65C36'};
 const seg=Object.entries(by).map(([s,n])=>`<div style="width:${n/total*100}%;background:${colors[s]}"></div>`).join('');
 const interiorN=by.interior||0;
 return `<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:14px">${seg}</div>
  <div class="legend">${Object.entries(by).map(([s,n])=>`<span class="li"><span class="sw" style="background:${colors[s]}"></span>${SOURCE[s].l} · ${n}</span>`).join('')}</div>
  ${interiorN?`<div class="mini-note" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">${svg('palette','')} มีลูกค้าอินทีเรีย ${interiorN} ราย — ต้องจ่ายค่าแนะนำ</div>`:''}`;
}
function leaderboard(){
 const rows=SALES.map(s=>{const won=state.leads.filter(l=>l.assignedTo===s.id&&['won','production','installing','done'].includes(l.stage));return{s,sum:won.reduce((a,l)=>a+dealTotal(l.id),0),n:won.length};}).sort((a,b)=>b.sum-a.sum);
 const max=Math.max(...rows.map(r=>r.sum),1);
 if(!rows.length)return '<div class="empty">ไม่มีข้อมูล</div>';
 return rows.map(r=>`<div class="lb-row"><div class="who">${avatar(r.s.id)}<span style="font-size:12.5px">${r.s.short}</span></div><div class="lb-track"><div class="lb-fill" style="width:${r.sum/max*100}%;background:${r.s.color}"></div></div><div style="text-align:right"><span style="font-weight:700" class="tnum">${THBk(r.sum)}</span> <span class="mini-note">${r.n} ดีล</span></div></div>`).join('');
}
let queueActions=[];
function actionQueue(){
 const items=[];queueActions=[];
 const L=scopedLeads();
 L.filter(l=>l.stage==='new').forEach(l=>{items.push({i:'inbox',c:'info',t:'มอบหมายลีดใหม่: '+bn(l),sub:SOURCE[l.source].l});queueActions.push(()=>openLead(l.id));});
 L.filter(l=>l.stage==='assigned').forEach(l=>{items.push({i:'ruler',c:'warn',t:'นัดวัดหน้างาน: '+bn(l),sub:personById(l.assignedTo).short});queueActions.push(()=>openLead(l.id));});
 state.quotes.filter(q=>q.status==='pending').forEach(q=>{const l=leadById(q.leadId);if(brand!=='all'&&l.brand!==brand)return;items.push({i:'doc',c:'warn',t:'รออนุมัติใบเสนอราคา '+q.id,sub:bn(l)});queueActions.push(()=>openLead(q.leadId));});
 state.installs.filter(i=>i.status==='scheduled').forEach(i=>{const l=leadById(i.leadId);if(brand!=='all'&&l.brand!==brand)return;const pi=payInfo(i.quoteId);const unpaid2=pi&&pi.sched[1].st!=='paid';items.push({i:'wrench',c:unpaid2?'crit':'accent',t:(unpaid2?'⚠ ยังไม่เก็บงวด 2 · ':'')+'นัดติดตั้ง '+fmtDate(i.scheduled),sub:bn(l)});queueActions.push(()=>{view='install';render();});});
 (state.tickets||[]).filter(t=>t.type==='punch'&&t.status!=='resolved').forEach(t=>{const l=leadById(t.leadId);if(brand!=='all'&&l&&l.brand!==brand)return;if(myScopeId()&&l&&l.assignedTo!==myScopeId())return;items.unshift({i:'wrench',c:'crit',t:'⚠ งานเก็บค้าง: '+bn(l),sub:TK_ISSUE[t.issue]});queueActions.unshift(()=>{view='service';render();});});
 (state.tickets||[]).filter(t=>t.type==='warranty'&&t.status!=='resolved').forEach(t=>{const l=leadById(t.leadId);if(brand!=='all'&&l&&l.brand!==brand)return;if(myScopeId()&&l&&l.assignedTo!==myScopeId())return;items.push({i:'shield',c:'info',t:'เคลมประกัน: '+bn(l),sub:TK_ISSUE[t.issue]});queueActions.push(()=>{view='service';render();});});
 if(!items.length)return '<div class="empty">✓ ไม่มีงานค้าง</div>';
 return items.slice(0,10).map((it,idx)=>`<div class="q-item" data-qi="${idx}" style="display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:8px;cursor:pointer"><span class="pill ${it.c}" style="width:28px;height:28px;padding:0;justify-content:center;border-radius:8px">${svg(it.i)}</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.t}</div><div class="mini-note">${it.sub}</div></div><span style="color:var(--text-faint)">→</span></div>`).join('');
}
function attachQueue(){document.querySelectorAll('.q-item').forEach(el=>{const i=+el.dataset.qi;el.onclick=queueActions[i];el.onmouseenter=()=>el.style.background='var(--surface-2)';el.onmouseleave=()=>el.style.background='transparent';});}

/* ============ CHINA / Vangarde production ============ */
const VG_STATUS={collecting:{l:'รวมออเดอร์',c:'neutral'},ordered:{l:'สั่งผลิตแล้ว',c:'warn'},shipping:{l:'ขนส่ง',c:'info'},customs:{l:'ศุลกากร',c:'info'},arrived:{l:'ถึงโรงงานไทย',c:'good'}};
const VG_FLOW=['collecting','ordered','shipping','customs','arrived'];
function nextLotId(){return 'LOT-'+String(state.seq.LOT++).padStart(3,'0');}
function newLot(){state.chinaLots.push({id:nextLotId(),status:'collecting',closed:false,shipFee:P().shipConsolidateFee||8000,importTax:0,ordered:'',shipDate:'',eta:'',pos:[]});save();render();}
function addPoToLot(quoteId,lotId){const lot=state.chinaLots.find(x=>x.id===lotId);if(!lot)return;const q=quoteById(quoteId);const cost=q?Math.round(calcQuote(q).cost/4.9):0;lot.pos.push({id:'PO-'+(state.seq.PO++),quoteId,cost,boxes:0,received:false,recvNote:''});save();render();}
function createLotWithPo(quoteId){const lot={id:nextLotId(),status:'collecting',closed:false,shipFee:P().shipConsolidateFee||8000,importTax:0,ordered:'',shipDate:'',eta:'',pos:[]};state.chinaLots.push(lot);addPoToLot(quoteId,lot.id);}
function advanceLot(lotId){const lot=state.chinaLots.find(x=>x.id===lotId);if(!lot)return;const i=VG_FLOW.indexOf(lot.status);if(i<VG_FLOW.length-1){lot.status=VG_FLOW[i+1];if(lot.status==='ordered'&&!lot.ordered)lot.ordered='2026-07-12';if(lot.status==='shipping'){lot.closed=true;if(!lot.shipDate)lot.shipDate='2026-07-12';}}save();render();}
function renderChina(){
 const c=document.getElementById('content');const cost=canSeeCost();
 const inLot=new Set();state.chinaLots.forEach(lot=>lot.pos.forEach(p=>inLot.add(p.quoteId)));
 const pending=state.leads.filter(l=>l.brand==='Vangarde'&&['won','production','installing','done'].includes(l.stage)).map(l=>({l,q:quoteOfLead(l.id)})).filter(x=>x.q&&!inLot.has(x.q.id));
 const openLots=state.chinaLots.filter(lt=>!lt.closed);
 c.innerHTML=`
  <div class="banner-info">${svg('truck')}สาย Vangarde: รวมออเดอร์เป็นล็อตเพื่อเฉลี่ยค่าส่ง (~฿8,000/ล็อต) · บันทึกวันสั่ง + ภาษีนำเข้า · เมื่อของถึงโรงงานให้ตรวจรับจำนวนกล่องตามลูกค้า</div>
  ${pending.length?`<div class="card" style="margin-bottom:16px;border-color:var(--good)"><div class="card-head" style="border-color:var(--border)">${svg('cart')}<h3>ออเดอร์ที่ปิดได้ · รอจัดลงล็อตสั่งจีน</h3><span class="pill good" style="margin-left:auto">${pending.length}</span></div>
   <div class="table-wrap"><table><thead><tr><th>ลูกค้า</th><th>สินค้า</th><th></th></tr></thead><tbody>
   ${pending.map(x=>`<tr><td style="font-weight:600">${bn(x.l)}<div class="mini-note">${x.l.site}</div></td><td>${((x.q.points||[]).map(p=>p.vgProduct).filter((v,i,a)=>v&&a.indexOf(v)===i).join(', '))||'-'}</td><td style="text-align:right;white-space:nowrap">${openLots.map(lt=>`<button class="btn sm" data-addlot="${lt.id}" data-q="${x.q.id}">+ ${lt.id}</button>`).join(' ')} <button class="btn sm primary" data-newlot="${x.q.id}">+ ล็อตใหม่</button></td></tr>`).join('')}
   </tbody></table></div></div>`:''}
  <div class="grid" style="gap:14px">
  ${state.chinaLots.map(lot=>{const st=VG_STATUS[lot.status]||VG_STATUS.collecting;const idx=VG_FLOW.indexOf(lot.status);const next=VG_FLOW[idx+1];
    const totalCost=lot.pos.reduce((a,p)=>a+p.cost,0);const feeEach=lot.pos.length?Math.round(lot.shipFee/lot.pos.length):lot.shipFee;
    const landed=totalCost*4.9+lot.shipFee+(lot.importTax||0);const boxesTotal=lot.pos.reduce((a,p)=>a+(p.boxes||0),0);const recvN=lot.pos.filter(p=>p.received).length;
    const atFactory=['arrived'].includes(lot.status);
    return `<div class="card card-pad">
     <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <span class="mono" style="font-size:14px;font-weight:700">${lot.id}</span><span class="pill ${st.c}">${st.l}</span>${lot.closed?'<span class="pill neutral">ปิดล็อต</span>':'<span class="pill warn">เปิดรับออเดอร์</span>'}
      <span class="spacer" style="flex:1"></span>
      ${next?`<button class="btn sm primary" data-advance="${lot.id}">→ ${VG_STATUS[next].l}</button>`:'<span class="pill good">ถึงโรงงานแล้ว</span>'}
     </div>
     <div class="steps" style="margin-bottom:12px">${VG_FLOW.map((s,i)=>`<div class="step"><div class="node ${i<idx?'done':i===idx?'active':''}">${i<idx?svg('check'):i+1}</div><span class="step-label">${VG_STATUS[s].l}</span></div>${i<VG_FLOW.length-1?`<div class="line ${i<idx?'done':''}"></div>`:''}`).join('')}</div>
     <div class="field-row three" style="margin-bottom:10px">
      <div class="field"><label>วันสั่งสินค้า</label><input type="date" data-lotf="ordered" data-lot="${lot.id}" value="${lot.ordered||''}"></div>
      <div class="field"><label>ETA ถึงไทย</label><input type="date" data-lotf="eta" data-lot="${lot.id}" value="${lot.eta||''}"></div>
      ${cost?`<div class="field"><label>ภาษีนำเข้า (฿)</label><input type="number" data-lotf="importTax" data-lot="${lot.id}" value="${lot.importTax||0}"></div>`:'<div class="field"><label>&nbsp;</label><div class="cost-hidden">— ภาษีนำเข้า (เฉพาะแอดมิน) —</div></div>'}
     </div>
     ${atFactory?`<div class="mini-note" style="margin-bottom:6px;color:var(--good);font-weight:600">✅ ของถึงโรงงานแล้ว — ตรวจรับจำนวนกล่องตามลูกค้า (${recvN}/${lot.pos.length} รับแล้ว)</div>`:''}
     <div class="table-wrap"><table><thead><tr><th>PO</th><th>ลูกค้า (เจ้าของงาน)</th>${cost?'<th class="num">ต้นทุน ¥</th>':''}<th class="num">ค่าส่งเฉลี่ย</th><th class="num" style="width:96px">จำนวนกล่อง</th><th style="width:120px">ตรวจรับ</th></tr></thead><tbody>
     ${lot.pos.length?lot.pos.map(po=>{const q=quoteById(po.quoteId);const l=q?leadById(q.leadId):null;return `<tr><td class="mono" style="font-size:12px">${po.id}</td><td style="font-weight:600">${bn(l)}<div class="mini-note">${l?(l.custCode||l.id):''}</div></td>${cost?`<td class="num">¥${po.cost.toLocaleString()}</td>`:''}<td class="num">${THB(feeEach)}</td>
       <td class="num"><input type="number" data-pof="boxes" data-lot="${lot.id}" data-po="${po.id}" value="${po.boxes||0}" style="width:66px;text-align:right;padding:5px 7px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface-2);color:var(--text);font-family:inherit"></td>
       <td><label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:${po.received?'600':'400'};color:${po.received?'var(--good)':'var(--text-muted)'}"><input type="checkbox" data-porecv data-lot="${lot.id}" data-po="${po.id}" ${po.received?'checked':''}> ${po.received?'รับครบแล้ว':'ยังไม่ได้รับ'}</label></td></tr>`;}).join(''):`<tr><td colspan="${cost?6:5}"><div class="empty" style="padding:16px">ยังไม่มีออเดอร์ในล็อตนี้</div></td></tr>`}
     </tbody></table></div>
     <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;flex-wrap:wrap;gap:6px">
      <span class="mini-note">${lot.pos.length} ออเดอร์ · ค่าส่งรวม ฿${lot.shipFee.toLocaleString()}${lot.importTax?' · ภาษีนำเข้า ฿'+lot.importTax.toLocaleString():''} · กล่องรวม ${boxesTotal} · รับแล้ว ${recvN}/${lot.pos.length}</span>
      ${cost&&totalCost?`<span>สินค้า ¥${totalCost.toLocaleString()} · <b>Landed ≈ ${THB(landed)}</b></span>`:''}
     </div>
    </div>`;}).join('')}
  <div><button class="btn" id="newEmptyLot">${svg('plus','ico')} เปิดล็อตใหม่ (ว่าง)</button></div>
  </div>`;
 c.querySelectorAll('[data-addlot]').forEach(b=>b.onclick=()=>addPoToLot(b.dataset.q,b.dataset.addlot));
 c.querySelectorAll('[data-newlot]').forEach(b=>b.onclick=()=>createLotWithPo(b.dataset.q));
 c.querySelectorAll('[data-advance]').forEach(b=>b.onclick=()=>advanceLot(b.dataset.advance));
 c.querySelectorAll('[data-lotf]').forEach(el=>el.onchange=()=>{const lot=state.chinaLots.find(x=>x.id===el.dataset.lot);if(lot){lot[el.dataset.lotf]=el.type==='number'?+el.value:el.value;save();}});
 c.querySelectorAll('[data-pof]').forEach(el=>el.onchange=()=>{const lot=state.chinaLots.find(x=>x.id===el.dataset.lot);const po=lot&&lot.pos.find(p=>p.id===el.dataset.po);if(po){po[el.dataset.pof]=+el.value;save();}});
 c.querySelectorAll('[data-porecv]').forEach(el=>el.onchange=()=>{const lot=state.chinaLots.find(x=>x.id===el.dataset.lot);const po=lot&&lot.pos.find(p=>p.id===el.dataset.po);if(po){po.received=el.checked;save();render();}});
 const nl=c.querySelector('#newEmptyLot');if(nl)nl.onclick=newLot;
}

 wireRows(c);
 c.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=e=>{e.stopPropagation();openInstallSheet(b.dataset.sheet);});

/* ============ INSTALLER WORK ORDER (bilingual, table + photos, customer sign-off) ============ */
function addYear(d){const p=(d||'2026-07-19').split('-');return ((+p[0])+1)+'-'+(p[1]||'07')+'-'+(p[2]||'19');}
function sheetProd(pt){if(pt.kind==='vangarde')return {th:pt.vgProduct||'-',en:pt.vgProduct||''};const th=pt.prodLabel||(pt.kind==='blind'?pt.blindType:pt.curtainType)||'-';return {th,en:PRODUCT_EN[th]||''};}
function sheetPhoto(pt,sz){const list=(pt.photos||[]).filter(x=>x&&x.url&&(''+x.url).startsWith('data:'));const p=list[0];return p?`<div style="position:relative;display:inline-block"><img src="${p.url}" style="width:${sz}px;height:${sz}px;object-fit:cover;border-radius:5px;border:1px solid #bbb">${list.length>1?`<span style="position:absolute;bottom:1px;right:1px;background:rgba(0,0,0,.62);color:#fff;font-size:8px;padding:0 3px;border-radius:3px">+${list.length-1}</span>`:''}</div>`:`<div style="width:${sz}px;height:${sz}px;border:1px dashed #ccc;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:8px;text-align:center">no<br>photo</div>`;}
function sheetCodes(pt){if(pt.kind==='curtain'){const fs=(pt.fabrics||[]).filter(f=>f.code).map(f=>`${f.layer}: <b>${f.code}</b>${f.w?' ('+f.w+'cm)':''}`);return fs.join('<br>')||'-';}if(pt.kind==='vangarde')return `Frame/เฟรม: <b>${pt.frameColor||'-'}</b><br>Fabric/ผ้า: <b>${pt.fabricCode||'-'}</b>`;return pt.blindType||'-';}
function sheetSystem(pt){const motor=pt.track==='motor'||(pt.kind==='vangarde'&&vgHasMotor(pt));let s=motor?`⚙ <b>Motor / มอเตอร์</b>${pt.motorModel&&pt.kind!=='vangarde'?' '+pt.motorModel:''}`:'Manual / ธรรมดา';if(motor&&pt.motorSide)s+=`<br>⚙ side ${SIDE_EN[pt.motorSide]||pt.motorSide}`;if(pt.openSide)s+=`<br>↔ Control ${SIDE_EN[pt.openSide]||pt.openSide}`;if(pt.kind==='vangarde'){const sysOn=VG_SYSTEMS.filter(([k])=>pt.systems&&pt.systems[k]).map(([,l])=>l);if(sysOn.length)s+='<br>'+sysOn.join(', ');}return s;}
function sheetInstall(pt){if(pt.kind==='vangarde'){const ins=VG_INSTALL.filter(([k])=>pt.install&&pt.install[k]).map(([,l])=>l);const acc=VG_ACCESSORIES.filter(([k])=>pt.accessories&&pt.accessories[k]).map(([,l])=>l);let v=ins.join(', ')||'-';if(acc.length)v+='<br>+ '+acc.join(', ');return v;}let s=`${pt.mountType||'-'} <span style="color:#888">(${MOUNT_EN[pt.mountType]||''})</span>`;if(pt.mountType==='เหนือกรอบวงกบ'&&pt.mountAboveCm)s+=`<br>↥ +${pt.mountAboveCm}cm above frame`;if(pt.sideAllowCm)s+=`<br>เผื่อข้าง / side allow ${pt.sideAllowCm}cm`;if(pt.slanted)s+=`<br><b style="color:#c0392b">⚠ เอียง / SLANTED${pt.slantNote?' ('+pt.slantNote+')':''}</b>`;return s;}
function installSheetHtml(i){
 const l=leadById(i.leadId);const q=quoteById(i.quoteId);const co=q?docCo(l,q):docCompany(l?l.brand:'VYNN');
 let pts=(q&&q.points&&q.points.length)?q.points:((q&&surveyById(q.surveyId))||{points:[]}).points;
 if(!pts||!pts.length){const sv=l?surveyOfLead(l.id):null;pts=sv?sv.points:[];}
 pts.forEach(migratePoint);
 const th2c=(th,en,st)=>`<th style="background:#eef1f4;${st||''}"><div style="font-size:10px">${th}</div><div style="font-size:7.5px;color:#777;font-weight:400">${en}</div></th>`;
 const rows=pts.map((pt,ix)=>{const pr=sheetProd(pt);return `<tr>
   <td style="text-align:center;font-weight:700">${ix+1}</td>
   <td style="text-align:center">${sheetPhoto(pt,72)}</td>
   <td><b>${pt.room||'-'}</b></td>
   <td><b>${pr.th}</b>${pr.en?`<div style="font-size:8.5px;color:#777">${pr.en}</div>`:''}${pt.detail?`<div style="font-size:8.5px;color:#555">${pt.detail}</div>`:''}</td>
   <td style="text-align:center;white-space:nowrap"><b style="font-size:12px">${pt.w} × ${pt.h}</b><div style="font-size:8px;color:#777">cm (W×H)</div></td>
   <td style="font-size:9.5px">${sheetCodes(pt)}</td>
   <td style="font-size:9.5px">${sheetSystem(pt)}</td>
   <td style="font-size:9.5px">${sheetInstall(pt)}</td>
   <td style="text-align:center;font-weight:700">${pt.qty}</td>
   <td style="font-size:9.5px">${pt.note?pt.note:''}</td>
  </tr>`;}).join('');
 const infoBox=`<div style="display:flex;gap:10px;margin:10px 0 6px"><div class="doc-box" style="flex:1"><table style="width:100%;border:none;margin:0"><tbody>${boxRow('ลูกค้า','Customer','<b>'+(l?l.name:'-')+'</b>')}${boxRow('รหัสลูกค้า','Cust. Code',(l&&l.custCode)||'-')}${boxRow('สถานที่','Site',(l&&l.site)||'-')}${boxRow('เบอร์โทร','Tel',(l&&l.phone)||'-')}</tbody></table></div><div class="doc-box" style="width:40%"><table style="width:100%;border:none;margin:0"><tbody>${boxRow('เลขที่งาน','Job No.',i.id)}${boxRow('วันติดตั้ง','Install Date',fmtDate(i.scheduled||i.desired))}${boxRow('ทีมช่าง','Install Team',i.team||'-')}${boxRow('อ้างอิงใบเสนอราคา','Quote Ref',i.quoteId||'-')}</tbody></table></div></div>`;
 const legend=`<div style="margin:4px 0 8px;font-size:9px;color:#555;background:#f7f7f5;border:1px solid #e6e6e2;border-radius:4px;padding:5px 9px">🗺 <b>สัญลักษณ์ / Legend:</b> &nbsp; ⚙ = มอเตอร์ / Motor &nbsp;·&nbsp; ↔ = ฝั่งควบคุม / Control side (L=ซ้าย, R=ขวา) &nbsp;·&nbsp; ↥ = ระยะเหนือวงกบ / Above frame &nbsp;·&nbsp; ⚠ = จุดพิเศษต้องระวัง / Special attention (เอียง / slanted)</div>`;
 const table=`<div style="overflow-x:auto"><table class="vynn-items" style="font-size:10px;width:100%"><thead><tr>
   ${th2c('#','No.','width:24px')}${th2c('รูปหน้างาน','Site Photo','width:82px')}${th2c('จุด/ห้อง','Location','width:88px')}${th2c('สินค้า','Product','width:120px')}${th2c('ขนาด','Size','width:70px')}${th2c('รหัสผ้า/สี','Fabric/Color Code','width:120px')}${th2c('ระบบ/ราง','System / Track','width:120px')}${th2c('วิธีติดตั้ง','Installation','width:150px')}${th2c('จำนวน','Qty','width:34px')}${th2c('หมายเหตุช่าง','Note','')}
  </tr></thead><tbody>${rows||'<tr><td colspan="10" style="text-align:center;color:#999;padding:16px">ไม่มีข้อมูลหน้างาน / No survey data</td></tr>'}</tbody></table></div>`;
 // saved sign-off (printed)
 const so=i.signOff;
 const savedBlock=so?`<div style="margin-top:14px;border:2px solid ${so.mode==='complete'?'#2e7d46':'#b77504'};border-radius:6px;padding:12px 14px">
   <div style="font-weight:800;color:${so.mode==='complete'?'#2e7d46':'#b77504'};font-size:13px">${so.mode==='complete'?'✓ งานเสร็จสมบูรณ์ · ลูกค้าเซ็นรับงานแล้ว / WORK COMPLETED – ACCEPTED BY CUSTOMER':'⚠ ลูกค้ารับทราบการเข้าหน้างาน (งานยังไม่เสร็จ) / SITE VISIT ACKNOWLEDGED – WORK NOT YET COMPLETE'}</div>
   ${so.note?`<div style="margin-top:6px;font-size:11px"><b>หมายเหตุงานที่ยังไม่เสร็จ / Unfinished-work note:</b> ${so.note}</div>`:''}
   <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:20px">
    <div style="text-align:center"><img src="${so.sig}" style="height:60px;max-width:230px;object-fit:contain;border-bottom:1px solid #333"><div style="font-size:11px;margin-top:3px">${so.name}</div><div style="font-size:9px;color:#888">ลูกค้า / Customer · ${fmtDate(so.at)}</div></div>
    <div style="text-align:center;width:230px"><div style="height:60px;border-bottom:1px solid #333"></div><div style="font-size:11px;margin-top:3px">${i.team||''}</div><div style="font-size:9px;color:#888">ช่างผู้ติดตั้ง / Installer</div></div>
   </div>
   ${so.mode==='complete'?`<div style="margin-top:8px;font-size:10px;color:#2e7d46">🛡 รับประกันงานติดตั้ง 1 ปี ${i.warrantyUntil?'(ถึง '+fmtDate(i.warrantyUntil)+')':''} / 1-year installation warranty</div>`:''}
  </div>`:`<div style="margin-top:14px;border:1px dashed #bbb;border-radius:6px;padding:10px 14px;color:#999;font-size:11px">— ยังไม่มีการเซ็นรับงาน · ใช้แผงด้านล่างเพื่อบันทึก / No sign-off yet — use the panel below —</div>`;
 return docLetterhead(co,'ใบสั่งงานติดตั้ง','Installation Work Order')+infoBox+legend+table+savedBlock;
}
function openInstallSheet(insId){
 const i=state.installs.find(x=>x.id===insId);if(!i)return;
 const paper=installSheetHtml(i);
 const so=i.signOff;const defMode=so?so.mode:(openPunchCount(i.quoteId)>0?'incomplete':'complete');
 const capture=`<div class="no-print" style="margin-top:16px;border-top:2px dashed #ccc;padding-top:14px">
   <div style="font-weight:800;font-size:13px;margin-bottom:8px">✍ ลูกค้าเซ็นรับงาน / Customer Sign-off</div>
   <div style="display:flex;flex-direction:column;gap:7px;font-size:12px;margin-bottom:10px">
    <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer"><input type="radio" name="soMode" value="complete" ${defMode==='complete'?'checked':''} style="margin-top:3px"><span><b>✓ งานเสร็จสมบูรณ์ — ลูกค้าเซ็นรับงาน</b><br><span style="color:#777;font-size:11px">Work complete – customer accepts (sets 1-year warranty)</span></span></label>
    <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer"><input type="radio" name="soMode" value="incomplete" ${defMode==='incomplete'?'checked':''} style="margin-top:3px"><span><b>⚠ งานยังไม่เสร็จ — ลูกค้ารับทราบการเข้าหน้างาน</b><br><span style="color:#777;font-size:11px">Not finished – customer acknowledges the site visit</span></span></label>
   </div>
   <div class="field"><label>ชื่อลูกค้าผู้เซ็นรับ / Customer name</label><input id="so-name" value="${so?so.name:(leadById(i.leadId)||{}).name||''}" style="max-width:340px"></div>
   <div class="field"><label>หมายเหตุ / งานที่ยังไม่เสร็จ (Unfinished-work note)</label><textarea id="so-note" rows="2" placeholder="เช่น รอผ้าซับในล็อตใหม่ / รางมอเตอร์ห้องนอนใหญ่ยังไม่มา">${so?so.note||'':''}</textarea></div>
   <div class="field"><label>ลายเซ็นลูกค้า / Customer signature (เซ็นในกรอบด้านล่าง)</label>
    <canvas id="so-canvas" width="480" height="150" style="border:1px solid #bbb;border-radius:6px;background:#fff;touch-action:none;max-width:100%"></canvas>
    <div style="margin-top:6px;display:flex;gap:8px"><button class="btn sm" id="so-clear">ล้างลายเซ็น / Clear</button></div>
   </div>
   <div style="display:flex;gap:10px;margin-top:8px"><button class="btn primary" id="so-save">✓ บันทึกการเซ็นรับ / Save sign-off</button></div>
  </div>`;
 let ov=document.getElementById('docOverlay');if(!ov){ov=document.createElement('div');ov.id='docOverlay';ov.className='doc-overlay';document.body.appendChild(ov);}
 let ps=document.getElementById('pageOrient');if(!ps){ps=document.createElement('style');ps.id='pageOrient';document.head.appendChild(ps);}ps.textContent='@page{size:A4 landscape;margin:10mm}';
 ov.innerHTML=`<div class="doc-toolbar doc-wide"><button class="btn" id="docClose">✕ ปิด</button><button class="btn primary" id="docPrint">${svg('print','ico')} พิมพ์ / บันทึก PDF</button></div><div class="doc-paper doc-wide" id="docPaper">${paper}${capture}</div>`;
 ov.style.display='block';
 ov.querySelector('#docClose').onclick=()=>{ov.style.display='none';};
 ov.querySelector('#docPrint').onclick=()=>window.print();
 const canvas=ov.querySelector('#so-canvas');initSigPad(canvas);
 ov.querySelector('#so-clear').onclick=()=>{const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);canvas._dirty=false;};
 ov.querySelector('#so-save').onclick=()=>{
  const mode=[...ov.querySelectorAll('input[name=soMode]')].find(r=>r.checked).value;
  const name=ov.querySelector('#so-name').value.trim();const note=ov.querySelector('#so-note').value.trim();
  const sig=canvas._dirty?canvas.toDataURL('image/png'):(i.signOff?i.signOff.sig:'');
  if(!name){alert('กรุณากรอกชื่อลูกค้าผู้เซ็นรับ / Please enter customer name');return;}
  if(!sig){alert('กรุณาให้ลูกค้าเซ็นในกรอบลายเซ็น / Please sign in the box');return;}
  if(mode==='complete'){const punch=openPunchCount(i.quoteId);if(punch>0&&!confirm('ยังมีงานเก็บค้าง '+punch+' รายการ — ยืนยันปิดงานว่าเสร็จสมบูรณ์?'))return;i.status='done';if(!i.warrantyUntil)i.warrantyUntil=addYear(i.scheduled||i.desired);}
  i.signOff={mode,name,sig,note,at:'2026-07-19'};
  save();render(false);openInstallSheet(i.id);
 };
}
function initSigPad(canvas){
 const ctx=canvas.getContext('2d');ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';canvas._dirty=false;
 let drawing=false,last=null;
 const pos=e=>{const r=canvas.getBoundingClientRect();const t=e.touches&&e.touches[0]?e.touches[0]:e;return {x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)};};
 const start=e=>{drawing=true;last=pos(e);e.preventDefault();};
 const move=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;canvas._dirty=true;e.preventDefault();};
 const end=()=>{drawing=false;};
 canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
 canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
}

 const c=document.getElementById('content');

 const punch=T.filter(t=>t.type==='punch'&&t.status!=='resolved');

 c.innerHTML=`

  <div class="card" style="margin-bottom:16px;${punch.length?'border-color:var(--warn)':''}"><div class="card-head">${svg('wrench')}<h3>งานเก็บค้าง (ติดตั้งแล้วยังไม่จบ)</h3><span class="pill ${punch.length?'warn':'good'}" style="margin-left:auto">${punch.length}</span></div>
   <div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ลูกค้า</th><th>ประเภท</th><th>ปัญหา (หมายเหตุ)</th><th>แจ้งเมื่อ</th><th>สถานะ</th><th></th></tr></thead><tbody>${punch.length?punch.map(row).join(''):emptyRow(7,'✓ ไม่มีงานเก็บค้าง — จบครบทุกงาน')}</tbody></table></div></div>
  <div class="card" style="margin-bottom:16px"><div class="card-head">${svg('shield')}<h3>เคลมประกัน (ในระยะรับประกัน 1 ปี)</h3><span class="pill ${warranty.length?'info':'good'}" style="margin-left:auto">${warranty.length}</span></div>
   <div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ลูกค้า</th><th>ประเภท</th><th>ปัญหา (หมายเหตุ)</th><th>แจ้งเมื่อ</th><th>สถานะ</th><th></th></tr></thead><tbody>${warranty.length?warranty.map(row).join(''):emptyRow(7,'ไม่มีเคลมประกันที่ค้างอยู่')}</tbody></table></div></div>
  <div class="card"><div class="card-head">${svg('check')}<h3>ปิดงานแล้ว</h3><span class="spacer"></span><span class="hint">${resolved.length} รายการ</span></div>
   <div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ลูกค้า</th><th>ประเภท</th><th>ปัญหา</th><th>ปิดเมื่อ</th><th>สถานะ</th><th></th></tr></thead><tbody>${resolved.length?resolved.map(row).join(''):emptyRow(7,'—')}</tbody></table></div></div>`;

 let mPhotos=[];
 const eligible=state.leads.filter(l=>quoteOfLead(l.id)&&['production','installing','done'].includes(l.stage));
 m.innerHTML=`<div style="padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">${svg('shield')}<h3 style="font-size:16px">แจ้งปัญหา / เพิ่มงานเก็บ</h3><span style="flex:1"></span><button class="icon-btn" id="mClose">${svg('x')}</button></div>

function saveEdit(){

  const lead=leadById(editState.leadId);const sv=surveyOfLead(editState.leadId);
  if(sv){sv.points=editState.points;sv.date='2026-07-12';}
  else{state.surveys.push({id:'SV-'+(state.seq.SV++),leadId:editState.leadId,date:'2026-07-12',by:lead.assignedTo||'s1',points:editState.points});}
  if(lead.stage==='assigned')lead.stage='surveyed';
  logAudit('survey','บันทึกวัดหน้างาน — '+lead.name+' ('+editState.points.length+' จุด)');
  save();closeEditor();render();openLead(editState.leadId);
 } else {
  const q=quoteById(editState.quoteId);if(!q)return;
  q.points=editState.points;q.date='2026-07-12';q.priceMode=editState.priceMode;
  const total=calcQuote(q).total;
  q.revisions.push({rev:q.revisions.length+1,date:'2026-07-12',discount:q.discount||0,adjust:q.adjust||0,note:'แก้ไขรายการม่าน (จุด/ชนิด/ผ้า)',status:q.status,total,by:'a1'});
  save();closeEditor();render();openLead(editState.leadId);
 }
}

/* ============ PRINTABLE DOCUMENTS ============ */
function money(n){return Math.round(n).toLocaleString('en-US');}
function bahtText(amount){
 amount=Math.round((+amount||0)*100)/100;const num=amount.toFixed(2).split('.');
 const th=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];const unit=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
 function chunk(s){s=(''+Math.abs(parseInt(s,10)));let res='';const L=s.length;for(let i=0;i<L;i++){const d=+s[i];const p=L-1-i;if(d===0)continue;if(p===1&&d===1)res+='สิบ';else if(p===1&&d===2)res+='ยี่สิบ';else if(p===0&&d===1&&L>1)res+='เอ็ด';else res+=th[d]+unit[p];}return res;}
 function readInt(s){s=(''+Math.floor(Math.abs(+s)));if(s==='0'||s==='')return 'ศูนย์';if(s.length<=6)return chunk(s);const head=s.slice(0,s.length-6),tail=s.slice(-6);return chunk(head)+'ล้าน'+(+tail?chunk(tail):'');}
 let text=readInt(num[0])+'บาท';text+=(num[1]==='00')?'ถ้วน':chunk(num[1])+'สตางค์';return text;
}
