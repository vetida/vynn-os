<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EF">
<meta name="robots" content="noindex">
<title>VYNN เบิกจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header with brand switch, single content column (max 920), fixed bottom nav with a raised + button; claims open as bottom sheets */
:root{
  --bg:#F6F3EF; --card:#FFFFFF; --soft:#F1ECE6; --ink:#2A2521; --muted:#8A8078; --line:#E8E1D9;
  --accent:#A38B78; --accent-d:#8A7261; --accent-bg:#F2EBE4; --on-accent:#FFFFFF;
  --green:#3F5B4B; --green-bg:#E3ECE5; --warn:#BF7A3F; --warn-bg:#FBEDDF; --bad:#B4544B; --bad-bg:#F8E4E1;
  --vynn:#A38B78; --vangarde:#3F5B4B;
  --scrim:rgba(42,37,33,.42); --shadow:0 1px 2px rgba(60,45,30,.04),0 6px 18px rgba(60,45,30,.06);
  --f-logo:"Cormorant Garamond",Georgia,serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:16px; color-scheme:light;
}
/* single warm-light theme by request */
:root:lang(lo){--f-body:"Noto Sans Lao","IBM Plex Sans Thai",system-ui,sans-serif}
:root:lang(my){--f-body:"Noto Sans Myanmar",system-ui,sans-serif}
:root:lang(my) body{line-height:1.85;font-size:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 120px}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex-shrink:0}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px}
.hd{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-logo);font-size:28px;font-weight:500;font-style:italic;flex-shrink:0;line-height:1}
.wordmark{display:flex;flex-direction:column;gap:0;padding-right:14px;margin-right:2px;border-right:1px solid var(--line)}
.wordmark b{font-family:var(--f-logo);font-weight:500;font-size:22px;letter-spacing:.14em;line-height:1.1;white-space:nowrap}
.wordmark b .v{color:var(--accent)} .wordmark b .g{color:var(--green)} .wordmark b i{font-style:normal;color:var(--line);margin:0 .3em}
.wordmark span{font-size:10px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
@media (max-width:760px){.wordmark{display:none}}
.hello.link{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;margin-right:auto;line-height:1.3;color:var(--ink)}
.hello span{font-size:13px;color:var(--muted)}
.hello b{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hright{display:flex;align-items:center;gap:10px;flex-shrink:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.live.saving i{background:var(--warn)} .live.err i{background:var(--bad)}
@media (max-width:480px){.live span{display:none}}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.lang button{border:0;background:none;border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:420px){.lang button{padding:3px 7px;font-size:11.5px}.hd{gap:8px}.mark{width:38px;height:38px;font-size:25px}}
.lang button:lang(th){font-family:"IBM Plex Sans Thai",system-ui,sans-serif}
.lang button:lang(lo){font-family:"Noto Sans Lao",system-ui,sans-serif}
.lang button:lang(my){font-family:"Noto Sans Myanmar",system-ui,sans-serif}
.lang button.on{background:var(--accent);color:#fff}
.lang.big button{padding:6px 16px;font-size:15px}
.bsw{max-width:920px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr auto;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.bsw button{border:0;background:none;border-radius:9px;padding:9px 12px;font-family:var(--f-logo);font-size:17px;font-weight:600;letter-spacing:.1em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsw button small{font-family:var(--f-logo);font-size:13px;letter-spacing:.06em;font-weight:500;margin-left:4px}
.bsw button.all{font-family:var(--f-body);font-size:13px;letter-spacing:0;font-weight:500;color:var(--muted)}
.bsw button.on{background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.bsw button.on.vangarde{background:var(--green)}
@media (max-width:420px){.bsw button{font-size:15px;padding:8px 6px}.bsw button small{display:none}}

/* bottom nav */
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.bnav-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:flex-end}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 2px;position:relative;min-width:0}
.bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bnav button.on{color:var(--ink);font-weight:600}
.bnav button.on .ic{color:var(--accent-d)}
.bnav .badge{position:absolute;top:0;left:calc(50% + 6px)}
.bnav .fabw{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
.bnav .fab{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:4px solid var(--bg);margin-top:-26px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(138,114,97,.35);padding:0;flex:none}
.bnav .fab .ic{width:24px;height:24px;color:#fff}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:inline-grid;place-items:center;font-weight:600}

main{max-width:920px;margin:14px auto 0;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
.link{border:0;background:none;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:2px;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* overview */
.ov-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ov-total{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ov-total .big{font-size:38px;font-weight:700;letter-spacing:-.01em;line-height:1;font-variant-numeric:tabular-nums}
.delta{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.delta b{display:inline-flex;align-items:center;gap:3px;background:var(--green-bg);color:var(--green);border-radius:6px;padding:1px 7px;font-weight:600;font-size:12.5px;width:max-content}
.delta b.up{background:var(--warn-bg);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;position:relative}
button.kpi:hover{border-color:var(--accent)}
.kpi .kic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-bottom:4px}
.kpi.warn .kic{background:var(--warn-bg);color:var(--warn)} .kpi.ok .kic{background:var(--green);color:#fff} .kpi.acc .kic{background:var(--soft);color:var(--accent-d)}
.kpi .k{font-size:13px;color:var(--ink);font-weight:500}
.kpi .v{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
@media (max-width:420px){.kpi .v{font-size:15.5px}.kpi{padding:10px}.kpis{gap:8px}}
.bnav .fabw span{white-space:nowrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:420px){.donut-wrap{grid-template-columns:120px minmax(0,1fr);gap:12px}}
.donut{aspect-ratio:1;border-radius:50%;position:relative;max-width:100%}
.donut::after{content:"";position:absolute;inset:24%;border-radius:50%;background:var(--card)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1;font-size:11px;color:var(--muted);line-height:1.3}
.donut-c b{font-size:20px;color:var(--ink);font-weight:700}
.dleg{display:flex;flex-direction:column;gap:7px;font-size:13px}
.dleg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.dleg i{width:9px;height:9px;border-radius:50%}
.dleg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* rows */
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:#FBF9F6}
.rico{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent-d);display:grid;place-items:center;flex-shrink:0}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.r-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.r-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.docno{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;white-space:nowrap;font-weight:500;display:inline-block}
.pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.ok{color:var(--green);background:var(--green-bg)}
.pill.acc{color:var(--accent-d);background:var(--accent-bg)} .pill.paid{color:#fff;background:var(--green)}
.pill.bad{color:var(--bad);background:var(--bad-bg)} .pill.flag{color:#fff;background:var(--bad)}
.tag{font-size:11px;padding:0 7px;border-radius:5px;background:var(--accent-bg);color:var(--accent-d);font-weight:500}
.job{font-size:11px;padding:0 7px;border-radius:5px;background:var(--soft);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}

.empty{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .ic{width:30px;height:30px;color:var(--accent)}
.notice{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.splash{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.splash .wm{font-family:var(--f-logo);font-size:34px;letter-spacing:.14em;font-weight:500}
.splash .wm .v{color:var(--accent)} .splash .wm .g{color:var(--green)} .splash .wm i{font-style:normal;color:var(--line);margin:0 .35em}
.splash .tl{letter-spacing:.3em;font-size:12px;color:var(--muted);text-transform:uppercase}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ink{color:var(--accent-d);border-color:var(--accent);background:var(--accent-bg)}
.btn.bad{color:var(--bad);border-color:var(--line);background:var(--card)}
.btn.bad.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ai{border-style:dashed;color:var(--accent-d);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}

/* list / report controls */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],textarea{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:0;width:100%}
.filters select{width:auto;max-width:100%}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lb small{color:var(--muted);margin-left:4px}
.bar .tr{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
table.wide{min-width:880px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px;background:#FBF9F6}
td.r,th.r{text-align:right}
tbody tr[data-open],tbody tr[data-period]{cursor:pointer}
tbody tr[data-open]:hover,tbody tr[data-period]:hover{background:#FBF9F6}
tr.sel td{background:var(--accent-bg)}
tfoot td{font-weight:600}

/* settings */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--ink);font-weight:500}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.people{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who img{width:34px;height:34px;border-radius:50%;flex-shrink:0}
.who div{min-width:0}
.who b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roles{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.roles label{display:flex;gap:4px;align-items:center;cursor:pointer}
@media (max-width:600px){.person{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted)}
.hint.ok{color:var(--green)} .hint.bad{color:var(--bad)}

/* payment */
.batch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.batch .who{flex:1}
.paybox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.payee{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
@media (max-width:480px){.payee{grid-template-columns:1fr}}
.cp{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.cp:first-child{border-top:0}
.cp .k{font-size:13px;color:var(--muted)}
.cp .v{font-weight:600;overflow-wrap:anywhere}
.cp .v.num{font-size:17px}
.qr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;width:200px;max-width:100%;justify-self:center}
.qr svg{width:180px;height:180px;max-width:100%}
.qr span{font-size:12px;color:#2A2521;font-weight:500}
.inc{display:flex;flex-direction:column;gap:4px;font-size:13px}
.inc div{display:flex;justify-content:space-between;gap:10px}
.inc div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
#panel{position:relative;background:var(--bg);width:min(640px,100%);max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out;box-shadow:0 -6px 30px rgba(42,37,33,.15)}
@media (min-width:701px){#sheet{align-items:center}#panel{border-radius:22px;max-height:calc(100% - 48px)}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#panel{animation:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{border:1px solid var(--line);background:var(--card);width:36px;height:36px;border-radius:50%;font-size:15px;flex-shrink:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:500;color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff}
.seg.brand button{font-family:var(--f-logo);font-size:16px;font-weight:600;letter-spacing:.1em}
.seg.brand button.on.vangarde{background:var(--green)}
.drop{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.drops{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:560px){.drops{grid-template-columns:1fr}}
.drop .lbl b{font-weight:600}
.drop .lbl{color:var(--muted)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.th{position:relative;width:84px;height:104px;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line);flex-shrink:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .pdf{width:100%;height:100%;display:grid;place-items:center;font-weight:700;color:var(--bad)}
.th .up{position:absolute;inset:0;background:var(--scrim);color:#fff;font-size:11px;display:grid;place-items:center;text-align:center;padding:4px}
.th .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:1}
.th a{display:block;width:100%;height:100%}
.drop-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.sh-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sh-foot .btn{min-width:120px}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.alert.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}

.slip{background:var(--card);border:1px solid var(--line);border-bottom:0;padding:18px 18px 26px;position:relative;display:flex;flex-direction:column;gap:12px;border-radius:var(--r) var(--r) 0 0;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7px) 0 0/16px 100% repeat-x;
          mask:radial-gradient(circle 7px at 50% 100%,transparent 6.5px,#000 7px) 0 0/16px 100% repeat-x}
.slip-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}
.slip-amt{font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stamp{font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;white-space:nowrap;transform:rotate(-3deg)}
.stamp.warn{color:var(--warn);background:var(--warn-bg)} .stamp.ok{color:var(--green);background:var(--green-bg)} .stamp.acc{color:var(--accent-d);background:var(--accent-bg)}
.stamp.paid{color:#fff;background:var(--green)} .stamp.bad{color:var(--bad);background:var(--bad-bg)}
.kv{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.dash{border:0;border-top:1.5px dashed var(--line);margin:0}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;font-size:14px}
.tl li i{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px}
.tl li i.bad{background:var(--bad)} .tl li i.ok{background:var(--green)}
.tl .t{color:var(--muted);font-size:12px}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.act .btns{display:flex;gap:8px;flex-wrap:wrap}
.act .btns .btn{flex:1}
.diff{font-weight:600}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);box-shadow:var(--shadow)}
#toast.bad{background:var(--bad)} #toast.warn{background:var(--warn)}
.skel{height:64px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);opacity:.7}
/* VANGARDE-only, login via VYNN·OS */
#bsw,.seg.brand,.wordmark{display:none!important}
</style>

const yr=y=>LANG==="th"?String(+y+543):String(y);           // Thai: Buddhist Era, Lao/Myanmar: CE
const yrS=y=>LANG==="th"?yr(y).slice(2):String(y);
const fmtDate=s=>{if(!s)return"-";const[y,m,d]=s.slice(0,10).split("-");return +d+" "+TM()[+m-1]+" "+yrS(y)};
const fmtTime=iso=>{const d=new Date(iso);return fmtDate(ymd(d))+" "+pad(d.getHours())+":"+pad(d.getMinutes())};
const localDay=iso=>iso?ymd(new Date(iso)):"";

const PERIODS=["day","week","month","quarter","year"];
function pkey(dateStr,p){
  if(!dateStr)return"";
  if(p==="day")return dateStr;
  if(p==="month")return dateStr.slice(0,7);
  if(p==="year")return dateStr.slice(0,4);
  if(p==="quarter")return dateStr.slice(0,4)+"-Q"+(Math.floor((+dateStr.slice(5,7)-1)/3)+1);
  const d=parseD(dateStr);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d); // week -> Monday
}
function plabel(k,p){
  if(!k)return"-";
  if(p==="day")return fmtDate(k);
  if(p==="month"){const[y,m]=k.split("-");return TM()[+m-1]+" "+yr(y)}
  if(p==="year")return t("y_label",{y:yr(k)});
  if(p==="quarter"){const[y,q]=k.split("-Q");return t("q_label",{q,y:yrS(y)})}
  const s=parseD(k),e=new Date(s);e.setDate(e.getDate()+6);
  return s.getDate()+(s.getMonth()===e.getMonth()?"":" "+TM()[s.getMonth()])+"–"+e.getDate()+" "+TM()[e.getMonth()]+" "+yrS(e.getFullYear());
}

const tlv=(id,v)=>id+pad(v.length)+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function ppPayload(id,amt){
  const d=String(id||"").replace(/\D/g,"");let acc;
  if(d.length===13)acc=tlv("02",d);else if(d.length===10&&d[0]==="0")acc=tlv("01","0066"+d.slice(1));else if(d.length===15)acc=tlv("03",d);else return null;
  const p=tlv("00","01")+tlv("01",amt?"12":"11")+tlv("29",tlv("00","A000000677010111")+acc)+tlv("53","764")+(amt?tlv("54",amt.toFixed(2)):"")+tlv("58","TH")+"6304";
  return p+crc16(p);
}
function qrSvg(text){
  if(typeof qrcode!=="function")return"";
  try{const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return""}
}

/* ---------- server API ---------- */
async function api(a,body){
  let r;
  try{r=await fetch("/api/exp",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(Object.assign({a},body||{}))})}
  catch(e){S.live="error";schedule();throw{code:"offline"}}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&a!=="login"&&a!=="changePin"){S.me=null;S.auth="login";render(true);if(S.sheet)closeSheet(true)}
  if(!r.ok)throw{code:r.status,message:j.error||""};
  return j;
}
const b64=blob=>new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=no;fr.readAsDataURL(blob)});
/* same shapes the page used before, now backed by /api/exp */
S.assets={
  async upload(blob,o){const mime=(o&&o.type)||blob.type||"image/jpeg";const r=await api("upload",{mime,data:await b64(blob)});return{id:r.id,url:fileUrl(r.id)}},
  delete(id){return api("discardFile",{id}).catch(()=>{})}
};
S.downloads={async save({filename,data}){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return{status:"saved"}}};
S.sample={async json(prompt,{images}){const imgs=[];for(const b of images)imgs.push({mime:b.type||"image/jpeg",data:await b64(b)});const r=await api("scan",{prompt,images:imgs});return r.result}};

async function boot(){
  applyLang();render(true);
  try{const st=await api("status");S.auth=st.needsSetup?"setup":st.me?"in":"login"}catch(e){S.live="error";S.auth="login"}
  if(S.auth==="in")await refresh();else render(true);
  setInterval(()=>{if(S.me&&document.visibilityState==="visible")refresh(true)},20000);
  document.addEventListener("visibilitychange",()=>{if(S.me&&document.visibilityState==="visible")refresh(true)});
}
async function refresh(quiet){
  if(refresh.busy)return;refresh.busy=true;
  try{
    const d=await api("sync");
    S.me=d.me.id;S.isOwner=d.me.role==="owner";S.cfg=d.cfg||{};S.canScan=!!d.scan;S.auth="in";
    const p={};d.users.forEach(u=>{p[u.id]=Object.assign({},u,{nick:u.name})});S.people=p;
    const key=JSON.stringify([d.claims.length,d.claims.map(c=>c.updatedAt).join()]);
    const changed=key!==S.lastKey;S.lastKey=key;
    S.claims=d.claims;S.loaded={cfg:true,people:true,claims:true};S.live="live";
    if(!quiet||changed){schedule();refreshSheet()}
    if(!quiet&&d.me.lang&&LANGS.includes(d.me.lang)&&!refresh.langDone){refresh.langDone=true;try{if(!localStorage.getItem("vynn_exp_lang"))setLang(d.me.lang)}catch(e){}}
    maybeOnboard();
  }catch(e){if(S.me){S.live="error";schedule()}}
  finally{refresh.busy=false}
}

const newBag=()=>({receipts:[],blobs:{},uploading:0,newIds:[]});
function openSheet(kind,arg){
  S.sheet={kind,arg,note:"",payRef:"",confirmCancel:false,key:null};
  S.bag=newBag();
  if(kind==="form")initForm();
  renderSheet();$("#sheet").hidden=false;document.body.classList.add("lock");
  setTimeout(()=>{const f=$("#panel").querySelector(".x");f&&f.focus()},30);
}
function closeSheet(force){
  const bags=[S.bag,S.sheet&&S.sheet.kind==="form"?S.form:null,S.sheet&&S.sheet.kind==="form"?S.fslip:null].filter(Boolean);
  if(!force&&bags.some(b=>b.uploading>0)){toast(t("wait_upload"),"warn");return}
  bags.forEach(b=>b.newIds.forEach(id=>S.assets&&S.assets.delete(id).catch(()=>{})));
  S.sheet=null;S.form=null;S.fslip=null;S.bag=null;$("#sheet").hidden=true;document.body.classList.remove("lock");
  if(S.pendingRender)render();
}
const xBtn=()=>`<button class="x" data-close aria-label="${esc(t("close"))}">✕</button>`;
function renderSheet(){
  if(!S.sheet)return;
  const k=S.sheet.kind;
  $("#panel").innerHTML=k==="form"?renderForm():k==="detail"?renderDetail():k==="pay"?renderPay():renderProfile();
  if(k==="form"){bindDrop("#drop",()=>S.form,drawForm);bindDrop("#sdrop",()=>S.fslip,drawSlip)}
}
function sheetKey(){
  const s=S.sheet;
  if(s.kind==="detail"){const c=S.claims.find(x=>x.id===s.arg);return c?c.updatedAt+"|"+(S.cfg.dealDay||""):"gone"}
  if(s.kind==="pay")return s.arg.map(id=>{const c=S.claims.find(x=>x.id===id);return c?c.updatedAt:"x"}).join()+JSON.stringify(S.people[payUid()]||{});
  return null;
}
function refreshSheet(force){
  if(!S.sheet||(S.sheet.kind!=="detail"&&S.sheet.kind!=="pay"))return;
  const k=sheetKey();
  if(!force&&k===S.sheet.key)return;
  if(typingIn($("#panel"))){S.sheet.stale=true;return}
  renderSheet();
}

async function shrink(f){
  if(!f.type.startsWith("image/")||f.type==="image/gif")return f;
  if(f.type==="image/jpeg"&&f.size<700*1024)return f;
  try{
    const bmp=await createImageBitmap(f),s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||f),"image/jpeg",.82));
  }catch(e){return f}
}
function upErr(e){const k={too_large:"u_too_large",unsupported_type:"u_unsupported",quota_or_state:"u_quota",rate_limited:"u_rate",not_granted:"u_notgranted"}[e&&e.code];return t(k||"u_fail")}
function addFiles(bag,files,redraw){
  if(!S.assets){toast(t("u_notgranted"),"bad");return}
  [...files].forEach(f=>{
    const pdf=f.type==="application/pdf";
    if(!pdf&&!f.type.startsWith("image/")){toast(t("u_only"),"bad");return}
    const it={type:pdf?"pdf":"image",uploading:true,url:pdf?"":URL.createObjectURL(f)};
    bag.receipts.push(it);bag.uploading++;redraw();
    (async()=>{
      try{const b=pdf?f:await shrink(f);const res=await S.assets.upload(b,{type:pdf?"application/pdf":(b.type||"image/jpeg")});
        it.id=res.id;it.url=res.url;it.uploading=false;bag.newIds.push(res.id);if(!pdf)bag.blobs[res.id]=b;}
      catch(e){bag.receipts.splice(bag.receipts.indexOf(it),1);toast(upErr(e),"bad")}
      finally{bag.uploading--;redraw()}
    })();
  });
}
function removeFile(bag,i,redraw){
  const r=bag.receipts[i];if(!r)return;bag.receipts.splice(i,1);
  if(r.id&&bag.newIds.includes(r.id)){bag.newIds=bag.newIds.filter(x=>x!==r.id);S.assets&&S.assets.delete(r.id).catch(()=>{})}
  redraw();
}

/* ---------- AI scan ---------- */
async function scan(){
  const f=S.form,sb=S.fslip,msg=$("#scanmsg"),btn=$("#scan");
  const imgs=b=>b.receipts.filter(r=>r.id&&b.blobs[r.id]).map(r=>b.blobs[r.id]);
  const bills=imgs(f).slice(0,3),slips=imgs(sb).slice(0,4-bills.length);
  if(!bills.length&&!slips.length){msg.className="hint bad";msg.textContent=(f.uploading||sb.uploading)?t("wait_upload"):t("s_need");return}
  btn.disabled=true;btn.textContent=t("s_reading");msg.className="hint";msg.textContent=t("s_wait");
  const list=cats();
  const prompt=`You are reading photos for ONE employee expense claim at a Thai curtain & blinds company. Staff may be Thai, Lao or Myanmar; receipts may be in Thai, Lao, Burmese or English.
The first ${bills.length} image(s) are receipts / tax invoices (what was bought). The next ${slips.length} image(s) are bank transfer slips (mobile banking / PromptPay) showing the employee paid.
Reply with ONLY a JSON object:
{"vendor": string|null, "date": "YYYY-MM-DD"|null, "billTotal": number|null, "vatIncluded": boolean, "title": string|null, "category": string|null, "slipAmount": number|null, "slipRef": string|null, "slipPayee": string|null, "slipDate": "YYYY-MM-DD"|null}
- Convert Buddhist Era years to Gregorian (2569 -> 2026). Thai month abbreviations: ม.ค.=1 … ธ.ค.=12.
- billTotal: grand total in THB on the receipts (sum if several bills); null if no receipts.
- vatIncluded: true only if a receipt is a tax invoice showing VAT 7%.
- slipAmount: total amount on the transfer slip(s) (sum if several); slipRef: the transaction reference / เลขที่รายการ of the first slip exactly as printed; slipPayee: the receiver name on the slip.
- vendor: shop name from the receipt, else the slip receiver. date: receipt date, else slip date.
- title: a short THAI description of what was bought (max 60 characters) — always Thai, because approvers read Thai.
- category: exactly one of ${JSON.stringify(list)}.
Use null for anything you cannot read.`;
  try{
    const o=await S.sample.json(prompt,{images:[...bills,...slips]});
    let n=0;const set=(id,v)=>{if(v!==null&&v!==undefined&&v!==""){$(id).value=v;n++}};
    const okD=d=>d&&/^\d{4}-\d{2}-\d{2}$/.test(d);
    set("#f-vendor",o.vendor||o.slipPayee);
    if(okD(o.date))set("#f-date",o.date);else if(okD(o.slipDate))set("#f-date",o.slipDate);
    const bt=typeof o.billTotal==="number"&&o.billTotal>0?Math.round(o.billTotal*100)/100:0;
    const sa=typeof o.slipAmount==="number"&&o.slipAmount>0?Math.round(o.slipAmount*100)/100:0;
    if(bt||sa)set("#f-amount",bt||sa);
    f.slipAmount=sa;
    if(o.slipRef)set("#f-sref",String(o.slipRef).slice(0,40));
    if(o.title&&!$("#f-title").value.trim())set("#f-title",String(o.title).slice(0,120));
    if(list.includes(o.category))set("#f-cat",o.category);
    if(typeof o.vatIncluded==="boolean")$("#f-vat").checked=o.vatIncluded;
    const notes=[];
    if(bt&&sa&&Math.abs(bt-sa)>1)notes.push(t("s_mis",{a:money(bt),b:money(sa)}));
    const d=dupsOf(o.slipRef);if(d.length)notes.push(t("s_dup",{x:d.map(x=>x.docNo).join(", ")}));
    msg.className=notes.length?"hint bad":n?"hint ok":"hint bad";
    msg.textContent=notes.length?notes.join(" · "):n?t("s_ok"):t("s_none");
  }catch(e){
    msg.className="hint bad";
    msg.textContent=t({not_granted:"s_notgranted",rate_limited:"s_rate",image_rejected:"s_badimg",invalid_json:"s_fail",sampling_disabled:"s_disabled"}[e&&e.code]||"s_fail");
    if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"))S.canScan=false;
  }finally{if(btn.isConnected){btn.disabled=false;btn.textContent=t("scan_btn")}}
}

    <div class="cp"><span class="k">PIN</span><span class="v num">${esc(pin)}</span><button class="btn sm" data-copy="${esc(pin)}">${t("copy")}</button></div>
    <div class="cp"><span class="k">URL</span><span class="v small">${esc(location.origin+location.pathname)}</span><button class="btn sm" data-copy="${esc(location.origin+location.pathname)}">${t("copy")}</button></div></div>
    <p class="hint">${t("pin_note",{n:esc(u.name||"")})}</p><button class="btn primary wide" id="pinok">OK</button>`;
  $("#sheet").hidden=false;document.body.classList.add("lock");
}
let tt=0;
function toast(m,k){const el=$("#toast");el.textContent=m;el.className=k||"";el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true},3200)}

boot();
</script>
